async function doImport(file){
  if(!file) return;
  const btn=root.querySelector('#btn-import-label'); const asli=btn?btn.textContent:'';
  if(btn) btn.textContent='Membaca file…';
  try{
    await loadExcelJS();
    const buf=await file.arrayBuffer();
    const wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf);
    const h=isWorkbookKlub(wb)?parseWorkbookKlub(wb):parseWorkbook(wb);
    if(!h.sesi.length && !h.siklus.length){ toast('Tidak ditemukan sheet Sesi/Siklus yang cocok di file itu.'); return; }
    if(!confirm(`Ditemukan ${h.sesi.length} sesi dan ${h.siklus.length} siklus. Impor akan MENGGANTI seluruh data yang ada. Lanjutkan?`)) return;
    STATE.pool=[...new Set([...STATE.pool,...h.pool])]; STATE.siklus=h.siklus; STATE.sesi=h.sesi; STATE.transactions=h.transactions; STATE.settings=h.settings;
    await saveAll();
    STATE.tab='dashboard'; window.scrollTo(0,0); render();
    toast(`${h.sesi.length} sesi berhasil diimpor.`);
  }catch(e){ console.error(e); toast(e && e.message==='load' ? 'Gagal memuat pustaka Excel.' : 'File tidak terbaca. Pastikan formatnya .xlsx.'); }
  finally{ if(btn) btn.textContent=asli||'Impor dari file Excel…'; }
}

const SYNC_KEY='kbr:sync';
let SYNC={url:'',key:'',code:'',on:false};
function loadSyncCfg(){ try{ const v=_lsGet(SYNC_KEY); if(v) SYNC=Object.assign(SYNC,JSON.parse(v)); }catch(e){} }
function saveSyncCfg(){ _lsSet(SYNC_KEY,JSON.stringify(SYNC)); }
function syncReady(){ return !!(SYNC.on&&SYNC.url&&SYNC.key&&SYNC.code); }
function kodeAcak(){ const a='abcdefghjkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<20;i++) s+=a[Math.floor(Math.random()*a.length)]; return s.replace(/(.{5})(?=.)/g,'$1-'); }
async function rpc(fn,body){
  const base=String(SYNC.url).trim().replace(/\/+$/,'');
  const r=await fetch(base+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'apikey':SYNC.key.trim(),'Authorization':'Bearer '+SYNC.key.trim(),'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(body)});
  const teks=await r.text();
  if(!r.ok) throw new Error('HTTP '+r.status+(teks?' — '+teks.slice(0,140):''));
  return teks?JSON.parse(teks):null;
}
function umur(t){ if(!t) return null; const d=Math.round((Date.now()-t)/1000);
  if(d<60) return 'baru saja'; if(d<3600) return Math.round(d/60)+' menit lalu'; if(d<86400) return Math.round(d/3600)+' jam lalu'; return Math.round(d/86400)+' hari lalu'; }
function mergeById(local,remote,idKey){
  const map=new Map();
  (local||[]).forEach(x=>map.set(x[idKey],x));
  (remote||[]).forEach(x=>{ const cur=map.get(x[idKey]); if(!cur||Number(x.updatedAt||x.createdAt||0)>Number(cur.updatedAt||cur.createdAt||0)) map.set(x[idKey],x); });
  return [...map.values()];
}
function mergeState(remote){
  if(!remote) return {pool:STATE.pool,siklus:STATE.siklus,sesi:STATE.sesi,transactions:STATE.transactions,galeri:STATE.galeri,settings:STATE.settings,settingsAt:STATE.settingsAt};
  const pool=[...new Set([...(STATE.pool||[]),...(remote.pool||[])])];
  const siklus=mergeById(STATE.siklus,remote.siklus,'id');
  const sesi=mergeById(STATE.sesi,remote.sesi,'id');
  const transactions=mergeById(STATE.transactions,remote.transactions,'id');
  const galeri=mergeById(STATE.galeri,remote.galeri,'id').slice(0,12);
  const rAt=Number(remote.settingsAt||0), lAt=Number(STATE.settingsAt||0);
  const settings=(rAt>lAt&&remote.settings)?remote.settings:STATE.settings;
  return {pool,siklus,sesi,transactions,galeri,settings,settingsAt:Math.max(rAt,lAt)};
}
let syncTimer=null;
function scheduleSync(){ if(!syncReady()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(true),1400); }
async function syncNow(diam){
  if(!syncReady()||STATE.syncing) return false;
  STATE.syncing=true; STATE.syncMsg='Menyinkronkan…'; paintSync();
  try{
    const remote=await rpc('kbr_kas_get',{code:SYNC.code.trim()});
    const m=mergeState(remote);
    STATE.pool=m.pool; STATE.siklus=m.siklus; STATE.sesi=m.sesi; STATE.transactions=m.transactions; STATE.galeri=m.galeri;
    STATE.settings=m.settings; STATE.settingsAt=m.settingsAt;
    for(const k of KEYS) await store.set(k,JSON.stringify(STATE[k]));
    await store.set('settingsAt',String(STATE.settingsAt));
    await rpc('kbr_kas_set',{code:SYNC.code.trim(),payload:{v:1,pool:STATE.pool,siklus:STATE.siklus,sesi:STATE.sesi,
      transactions:STATE.transactions,galeri:STATE.galeri,settings:STATE.settings,settingsAt:STATE.settingsAt}});
    STATE.syncAt=Date.now(); STATE.syncMsg=''; _lsSet('kbr:syncAt',String(STATE.syncAt));
    render();
    if(!diam) toast('Tersinkron dengan perangkat lain.');
    return true;
  }catch(e){ console.error(e); STATE.syncMsg='Gagal: '+(e.message||'tidak terhubung'); paintSync(); if(!diam) toast('Sinkronisasi gagal. '+(e.message||'').slice(0,80)); return false; }
  finally{ STATE.syncing=false; }
}
function syncStatusText(){
  if(!SYNC.on) return 'Nonaktif — data hanya tersimpan di perangkat ini.';
  if(!syncReady()) return 'Belum lengkap — isi URL proyek, kunci anon, dan kode klub.';
  if(STATE.syncMsg) return STATE.syncMsg;
  return STATE.syncAt?('Tersinkron '+umur(STATE.syncAt)):'Aktif — belum pernah menyinkronkan.';
}
function paintSync(){
  const el=root.querySelector('#sync-status'); if(!el) return;
  el.textContent=syncStatusText();
  el.className='tiny '+(STATE.syncMsg&&STATE.syncMsg.startsWith('Gagal')?'sync-bad':(syncReady()?'sync-ok':''));
}
const SQL_SETUP=`-- Jalankan sekali di Supabase -> SQL Editor -> New query -> Run
create table if not exists kbr_kas (
  klub        text primary key,
  data        jsonb not null,
  updated_at  timestamptz not null default now()
);
alter table kbr_kas enable row level security;

create or replace function kbr_kas_get(code text)
returns jsonb language sql security definer set search_path = public as $$
  select data from kbr_kas where klub = code;
$$;

create or replace function kbr_kas_set(code text, payload jsonb)
returns timestamptz language sql security definer set search_path = public as $$
  insert into kbr_kas (klub, data, updated_at)
  values (code, payload, now())
  on conflict (klub) do update
    set data = excluded.data, updated_at = now()
  returning updated_at;
$$;

revoke all on function kbr_kas_get(text) from public;
revoke all on function kbr_kas_set(text, jsonb) from public;
grant execute on function kbr_kas_get(text) to anon;
grant execute on function kbr_kas_set(text, jsonb) to anon;`;
function renderSyncCard(){
  return `
    <div class="slabel">Sinkronisasi antar perangkat</div>
    <div class="card">
      <div id="sync-status" class="tiny ${syncReady()?'sync-ok':''}" style="margin-bottom:12px;">${syncStatusText()}</div>
      <div class="seg" id="seg-sync" style="margin-bottom:${SYNC.on?'14px':'0'};">
        <button type="button" data-v="off" class="${SYNC.on?'':'active'}">Perangkat ini saja</button>
        <button type="button" data-v="on" class="${SYNC.on?'active':''}">Sinkron online</button>
      </div>
      <div id="sync-form" class="${SYNC.on?'':'hide'}">
        <div class="field"><label>URL proyek Supabase</label><input id="sy-url" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://xxxx.supabase.co" value="${esc(SYNC.url)}"/></div>
        <div class="field"><label>Kunci anon (public anon key)</label><input id="sy-key" type="text" autocapitalize="off" spellcheck="false" placeholder="eyJhbGciOi..." value="${esc(SYNC.key)}"/></div>
        <div class="field"><label>Kode klub — rahasia, sama di semua HP pengurus</label>
          <input id="sy-code" type="text" autocapitalize="off" spellcheck="false" placeholder="mis. kabur-badminton-7f3a" value="${esc(SYNC.code)}"/>
          <button type="button" class="tipnext" id="btn-kode" style="margin-top:8px;font-size:11.5px;font-weight:800;color:var(--gold-ink);">Buatkan kode acak →</button></div>
        <button class="btn btn-onyx" id="btn-sync-save" style="margin-top:4px;">Simpan &amp; sinkronkan sekarang</button>
        <div class="tiny" style="margin-top:10px;">Isi ketiganya persis sama di semua HP pengurus. Data digabung otomatis berdasarkan id, jadi catatan tidak saling menimpa.</div>
        <details style="margin-top:14px;">
          <summary style="font-size:12px;font-weight:800;color:var(--gold-ink);cursor:pointer;">Cara menyiapkan Supabase (gratis, ±10 menit)</summary>
          <ol style="font-size:12px;line-height:1.65;color:var(--ink-2);padding-left:18px;margin:10px 0 0;">
            <li>Buka supabase.com, daftar gratis, buat project baru (region Singapore).</li>
            <li>Masuk <b>SQL Editor</b> → New query → tempel skrip di bawah → Run.</li>
            <li>Masuk <b>Project Settings → API</b>. Salin <b>Project URL</b> dan <b>anon public key</b> ke kolom di atas.</li>
            <li>Buat kode klub yang panjang &amp; acak, isikan sama persis di HP semua pengurus.</li>
          </ol>
          <button type="button" class="btn btn-ghost" id="btn-salin-sql" style="margin-top:12px;">Salin skrip SQL</button>
          <pre id="sql-box" style="margin-top:10px;background:var(--sunk);border-radius:12px;padding:12px;font-size:10px;line-height:1.5;overflow-x:auto;white-space:pre;">${esc(SQL_SETUP)}</pre>
        </details>
        <div class="tiny" style="margin-top:14px;">Mau di-hosting online juga? Simpan file ini lalu drag-and-drop ke <b>app.netlify.com/drop</b> — gratis, langsung dapat link. Sinkronnya tetap lewat Supabase di atas.</div>
      </div>
    </div>`;
}
function attachSyncHandlers(){
  root.querySelectorAll('#seg-sync button').forEach(b=>b.addEventListener('click',async()=>{
    SYNC.on=b.dataset.v==='on'; saveSyncCfg(); render(); if(SYNC.on&&syncReady()) syncNow(false);
  }));
  const kode=root.querySelector('#btn-kode');
  if(kode) kode.addEventListener('click',()=>{ root.querySelector('#sy-code').value=kodeAcak(); });
  const salin=root.querySelector('#btn-salin-sql');
  if(salin) salin.addEventListener('click',async()=>{
    try{ await navigator.clipboard.writeText(SQL_SETUP); toast('Skrip SQL disalin.'); }
    catch(e){ const r=document.createRange(); r.selectNode(root.querySelector('#sql-box')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Skrip tersorot — tekan lama lalu Salin.'); }
  });
  const simpan=root.querySelector('#btn-sync-save');
  if(simpan) simpan.addEventListener('click',async()=>{
    SYNC.url=root.querySelector('#sy-url').value.trim(); SYNC.key=root.querySelector('#sy-key').value.trim(); SYNC.code=root.querySelector('#sy-code').value.trim();
    SYNC.on=true; saveSyncCfg();
    if(!syncReady()){ toast('Ketiga kolom harus diisi.'); paintSync(); return; }
    simpan.disabled=true; simpan.textContent='Menghubungkan…';
    const ok=await syncNow(false);
    simpan.disabled=false; simpan.textContent='Simpan & sinkronkan sekarang';
    if(ok) toast('Sinkronisasi aktif.');
  });
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) scheduleSync(); });
setInterval(()=>{ if(!document.hidden) syncNow(true); },45000);

(async function init(){ render(); await loadAll(); render(); if(syncReady()) syncNow(true); })();

})();
</script>
