function siklusLunasInfo(sk){
const total=sk.full.length, lunas=sk.full.filter(f=>f.lunas).length;
const terkumpul=sk.full.filter(f=>f.lunas).reduce((s,f)=>s+Number(f.jumlah),0);
const potensi=sk.full.reduce((s,f)=>s+Number(f.jumlah),0);
return {total,lunas,belum:total-lunas,terkumpul,potensi};
}
function statusKas(kas,avgKeluar){
if(kas<0) return 'DEFISIT';
if(avgKeluar>0 && kas<avgKeluar) return 'KETAT';
return 'AMAN';
}
function courtBookingsOf(se){ return (se&&se.biaya||[]).filter(b=>b.kategori==='Sewa Lapangan'); }
function durasiJamText(jam){
if(!jam) return '';
const m=/(\d{1,2})[.:](\d{2})\s*-\s*(\d{1,2})[.:](\d{2})/.exec(jam);
if(!m) return '';
const start=Number(m[1])+Number(m[2])/60, end=Number(m[3])+Number(m[4])/60;
let d=end-start; if(d<=0) d+=24;
const r=Math.round(d*100)/100;
return (r%1===0?r:r.toFixed(1))+' jam';
}

function moneyVal(el){ return Number(String(el.value).replace(/\D/g,''))||0; }
function reformatMoney(el){
const raw=el.value, caret=el.selectionStart==null?raw.length:el.selectionStart;
const db=raw.slice(0,caret).replace(/\D/g,'').length;
const digits=raw.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
const out=digits?Number(digits).toLocaleString('id-ID'):'';
el.value=out;
let c=0,pos=out.length;
if(db===0) pos=0; else for(let i=0;i<out.length;i++){ if(/\d/.test(out[i])) c++; if(c===db){ pos=i+1; break; } }
try{ el.setSelectionRange(pos,pos); }catch(e){}
}

/* =================== Auto-rotating rail helper =================== */
function attachAutoRail(railSel,dotsSel,count,intervalMs,stateKey){
const rail=root.querySelector(railSel); if(!rail||count<2) return;
const dots=dotsSel?[...root.querySelectorAll(dotsSel+' i')]:[];
const step=()=>rail.firstElementChild? rail.firstElementChild.getBoundingClientRect().width+10 : 1;
let idx=STATE[stateKey]||0;
const goTo=(i)=>{ idx=((i%count)+count)%count; STATE[stateKey]=idx; rail.scrollTo({left:idx*step(),behavior:'smooth'}); dots.forEach((d,j)=>d.classList.toggle('on',j===idx)); };
goTo(idx);
AUTO_TIMERS[railSel]=setInterval(()=>goTo(idx+1),intervalMs);
const pause=()=>{ clearInterval(AUTO_TIMERS[railSel]); };
const resume=()=>{ clearInterval(AUTO_TIMERS[railSel]); AUTO_TIMERS[railSel]=setInterval(()=>goTo(idx+1),intervalMs); };
rail.addEventListener('pointerdown',pause);
rail.addEventListener('pointerup',resume);
rail.addEventListener('scroll',()=>{ const i=Math.round(rail.scrollLeft/step()); if(i!==idx){ idx=((i%count)+count)%count; STATE[stateKey]=idx; dots.forEach((d,j)=>d.classList.toggle('on',j===idx)); } },{passive:true});
}

function transaksiPeriodeAktif(){
const sk=activeSiklus();
if(!sk) return STATE.transactions;
const sesiIds=new Set(STATE.sesi.filter(se=>se.siklusId===sk.id).map(se=>se.id));
return STATE.transactions.filter(t=>t.siklusId===sk.id||sesiIds.has(t.sesiId));
}
function totalPeriodeAktif(){
const txs=transaksiPeriodeAktif();
const masuk=txs.filter(t=>t.jenis==='Masuk').reduce((s,t)=>s+Number(t.jumlah),0);
const keluar=txs.filter(t=>t.jenis==='Keluar').reduce((s,t)=>s+Number(t.jumlah),0);
return {masuk,keluar,net:masuk-keluar};
}
function keluarPeriodeAktif(){
const sk=activeSiklus();
if(!sk) return STATE.transactions.filter(t=>t.jenis==='Keluar');
const sesiIds=new Set(STATE.sesi.filter(se=>se.siklusId===sk.id).map(se=>se.id));
return STATE.transactions.filter(t=>t.jenis==='Keluar'&&(t.siklusId===sk.id||sesiIds.has(t.sesiId)));
}
function komposisiPengeluaran(){
const txs=keluarPeriodeAktif();
const map={};
txs.forEach(t=>{ const k=t.kategori||'Lainnya (Pengeluaran)'; map[k]=(map[k]||0)+Number(t.jumlah||0); });
const total=Object.values(map).reduce((a,b)=>a+b,0);
const rows=Object.entries(map).map(([k,v])=>({kategori:k,jumlah:v,pct:total?Math.round(v/total*100):0})).sort((a,b)=>b.jumlah-a.jumlah);
return {rows,total};
}
function sorotanPeriode(){
const sk=activeSiklus();
const sesiPeriode=sesiUrut().filter(se=>!sk||se.siklusId===sk.id);

const totalKeluar=sesiPeriode.reduce((s,se)=>s+sesiTotals(se.id).keluar,0);
const freq={};
sesiPeriode.forEach(se=>se.partial.forEach(p=>{ const nm=(p.nama||'').trim(); if(nm) freq[nm]=(freq[nm]||0)+1; }));
const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
return {label:sk?sk.label:'Semua periode',sesiCount:sesiPeriode.length,totalMasuk,totalKeluar,net:totalMasuk-totalKeluar,topPartial:top?{nama:top[0],kali:top[1]}:null};

function renderAnggotaTotalTable(){

const fulls=(skAktif?skAktif.full:[]).filter(f=>(f.nama||'').trim())
.map(f=>f.nama.trim()).sort((a,b)=>a.localeCompare(b));

const sesiAktif=sesiUrut().filter(se=>skAktif?se.siklusId===skAktif.id:true);

const total=fulls.length+partials.length;
