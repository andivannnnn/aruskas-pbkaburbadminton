<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

:root{
  --canvas:#F4F2EC; --surface:#FFFFFF; --sunk:#F6F4EE;
  --ink:#15130E; --ink-2:#463F30; --muted:#8A8172;
  --onyx:#0E0E0E; --onyx-2:#1C1B18;
  --gold:#C9A24B; --gold-2:#E8C36E; --gold-ink:#7A5A12; --gold-bg:#FBF1DC;
  --silver:#C4C8CC;
  --net:#2FB673; --net-ink:#0F6B45; --net-bg:#E3F7EC;
  --miss:#E8604C; --miss-ink:#B03323; --miss-bg:#FCEAE6;
  --violet:#6C6BE8; --hair:#E7E2D6;
  --sh-1:0 1px 2px rgba(21,19,14,.06), 0 10px 26px -14px rgba(21,19,14,.22);
  --sh-2:0 18px 40px -16px rgba(14,14,14,.5);
  --r-card:20px; --r-field:14px;
  --font-ui:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-dp:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--canvas);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;}
#root{max-width:460px;margin:0 auto;min-height:100vh;padding:0 0 112px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;color:inherit;}
.num{font-family:var(--font-dp);font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.hide{display:none !important;}
:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}

.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 14px;}
.head .brand{display:flex;align-items:center;gap:10px;}
.head .logo{width:36px;height:36px;border-radius:10px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.25);flex:none;}
.head .app{font-family:var(--font-dp);font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.15;}
.head .today{font-size:10.5px;color:var(--muted);margin-top:1px;font-weight:600;}
.cyclechip{flex:none;background:var(--onyx);color:#fff;border-radius:999px;padding:7px 12px;font-size:10.5px;font-weight:700;box-shadow:var(--sh-1);}
.view{padding:0 16px;}

.hero{background:var(--onyx);color:#fff;border-radius:26px;padding:20px;box-shadow:var(--sh-2);margin-bottom:14px;position:relative;overflow:hidden;border:1px solid #2A2924;}
.hero .courtlines{position:absolute;inset:0;opacity:.5;}
.hero .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--gold-2);position:relative;z-index:1;}
.hero .big{font-family:var(--font-dp);font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:6px;position:relative;z-index:1;}
.hero .sub{font-size:11.5px;opacity:.68;margin-top:5px;font-weight:500;position:relative;z-index:1;}
.hero .toprow{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.hero .narrative{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;line-height:1.55;color:rgba(255,255,255,.82);font-weight:500;position:relative;z-index:1;}
.pill{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.pill.AMAN{background:var(--net);color:#06301D;}
.pill.KETAT{background:var(--gold);color:#241a03;}
.pill.DEFISIT{background:var(--miss);color:#3F0E08;}

.card{background:var(--surface);border-radius:var(--r-card);padding:16px 17px;margin-bottom:12px;box-shadow:var(--sh-1);}
.card > h3{font-size:13.5px;font-weight:700;letter-spacing:-.01em;margin:0 0 2px;}
.card .csub{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:12px;}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.tile{background:var(--surface);border-radius:18px;padding:14px 15px;box-shadow:var(--sh-1);}
.tile .l{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em;}
.tile .v{font-size:19px;font-weight:700;margin-top:5px;}
.tile .v.up{color:var(--net-ink);} .tile .v.down{color:var(--miss-ink);}
.tile .d{font-size:10px;font-weight:700;margin-top:3px;}
.tile .d.up{color:var(--net-ink);} .tile .d.down{color:var(--miss-ink);}

.line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);}
.line:last-child{border-bottom:none;}
.line .k{font-size:13px;color:var(--ink-2);font-weight:500;}
.line .v{font-size:14.5px;font-weight:700;}
.up{color:var(--net-ink);} .down{color:var(--miss-ink);}

.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:3px;}
.seg button{flex:1;padding:8px 6px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);transition:background .18s,color .18s;}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(21,19,14,.12);}

.tag{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
.tag.ok{background:var(--net-bg);color:var(--net-ink);}
.tag.watch{background:var(--gold-bg);color:var(--gold-ink);}
.tag.over{background:var(--miss-bg);color:var(--miss-ink);}
.tag.idle{background:var(--sunk);color:var(--muted);}
.tag.full{background:var(--gold-bg);color:var(--gold-ink);}
.tag.partial{background:#EAEAFB;color:var(--violet);}

.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:0 8px 8px 0;}
.tbl td{font-size:12.5px;padding:9px 8px 9px 0;border-top:1px solid var(--hair);font-weight:600;}
.tbl tr:first-child td{border-top:none;}
.tbl td:last-child,.tbl th:last-child{text-align:right;}

.kastot{display:flex;gap:10px;margin-bottom:14px;}
.kastot .kt{flex:1;background:var(--sunk);border-radius:14px;padding:10px 12px;}
.kastot .kt .kl{font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;}
.kastot .kt .kv{font-size:15px;font-weight:800;margin-top:3px;}
.combars{display:flex;align-items:flex-end;gap:10px;height:96px;margin:15px 0 3px;}
.combars .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;}
.combars .grp{flex:1;display:flex;gap:3px;align-items:flex-end;width:100%;}
.combars .grp i{flex:1;border-radius:4px 4px 2px 2px;min-height:3px;transition:height .3s;}
.combars .grp i.in{background:var(--net);}
.combars .grp i.out{background:var(--miss);opacity:.7;}
.colval{margin-top:5px;text-align:center;line-height:1.3;}
.colval b{display:block;font-size:8.6px;font-weight:800;}
.colval b.up{color:var(--net-ink);}
.colval b.down{color:var(--miss-ink);}
.axis{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);font-weight:700;}
.legend-mini{display:flex;gap:14px;margin-top:10px;}
.legend-mini span{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--muted);}
.legend-mini i{width:8px;height:8px;border-radius:3px;display:inline-block;}

.railhead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 9px;}
.railhead .rt{font-size:13.5px;font-weight:700;}
.railhead .rs{font-size:10.5px;color:var(--muted);font-weight:600;}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px 4px;padding:0 16px 2px;scroll-behavior:smooth;}
.rail::-webkit-scrollbar{display:none;}
.dots-mini{display:flex;gap:5px;justify-content:center;margin:9px 0 4px;}
.dots-mini i{width:5px;height:5px;border-radius:999px;background:#DCD5C0;display:block;transition:width .2s,background .2s;}
.dots-mini i.on{width:14px;background:var(--gold-ink);}

.scard{flex:0 0 78%;scroll-snap-align:start;background:var(--surface);border-radius:18px;padding:14px 15px;box-shadow:var(--sh-1);}
.scard .sd{font-size:12.5px;font-weight:700;}
.scard .sl{font-size:10px;color:var(--muted);font-weight:600;margin-top:1px;}
.scard .srow{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;}
.scard .srow b{font-size:12.5px;}
.wk-slide{max-height:300px;overflow-y:auto;}

.gslide{flex:0 0 100%;scroll-snap-align:center;position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--sh-1);aspect-ratio:4/3;background:var(--onyx);}
.gslide img{width:100%;height:100%;object-fit:cover;display:block;}
.gslide .gcap{position:absolute;left:0;right:0;bottom:0;padding:20px 14px 12px;background:linear-gradient(to top,rgba(0,0,0,.72),transparent);color:#fff;font-size:11.5px;font-weight:700;}
.gslide .gdel{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;}
.upload-tile{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;border-radius:18px;border:1.5px dashed #CBC3AE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:11.5px;font-weight:700;background:var(--sunk);}

.hlgroup{margin-bottom:4px;}
.hlgroup .hgt{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 2px 8px;}
.hl-card{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair);text-decoration:none;color:inherit;}
.hl-card:last-child{border-bottom:none;}
.hl-thumb{width:46px;height:46px;border-radius:12px;flex:none;position:relative;overflow:hidden;background:var(--sunk);display:flex;align-items:center;justify-content:center;}
.hl-thumb img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;}
.hl-thumb .fallback-ic{width:20px;height:20px;color:#fff;position:relative;z-index:0;}
.hl-thumb.yt{background:#FF3B30;}
.hl-thumb.ig{background:linear-gradient(135deg,#F58529,#DD2A7B,#8134AF);}
.hl-thumb .plat{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);z-index:2;}
.hl-thumb .plat.yt{background:#FF3B30;}
.hl-thumb .plat.ig{background:linear-gradient(135deg,#F58529,#DD2A7B,#8134AF);}
.hl-thumb .plat svg{width:10px;height:10px;}
.hl-thumb .badge{position:absolute;left:-3px;top:-3px;width:16px;height:16px;border-radius:5px;object-fit:cover;border:1.5px solid var(--surface);z-index:2;}

.spot-slide{flex:0 0 86%;scroll-snap-align:center;border-radius:20px;overflow:hidden;box-shadow:var(--sh-2);position:relative;aspect-ratio:4/3;background:var(--onyx);color:#fff;}
.spot-slide .spot-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.spot-slide .spot-ig-bg{position:absolute;inset:0;background:linear-gradient(135deg,#F58529,#DD2A7B,#8134AF);display:flex;align-items:center;justify-content:center;}
.spot-slide .spot-ig-bg svg{width:56px;height:56px;color:rgba(255,255,255,.92);}
.spot-slide .spot-scrim{position:absolute;inset:0;background:rgba(14,14,14,.38);}
.spot-slide .spot-tag{position:absolute;top:12px;left:12px;z-index:2;display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.45);color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:5px 10px 5px 8px;border-radius:999px;}
.spot-slide .spot-tag svg{width:11px;height:11px;flex:none;}
.spot-slide .spot-go{position:absolute;top:11px;right:11px;z-index:2;width:27px;height:27px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
.spot-slide .spot-body{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:44px 16px 15px;}
.spot-slide .spot-panel{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:16px 15px 14px;background:linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,.08) 78%,transparent);}
.spot-slide .spot-title{font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.25;}
.spot-slide .spot-sub{font-size:10.5px;opacity:.75;margin-top:3px;font-weight:500;}
.spot-slide a.spot-link{position:absolute;inset:0;z-index:3;}
.spot-bar{display:flex;height:9px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12);margin:8px 0 13px;flex:none;}
.spot-bar i{height:100%;}
.spot-legend{display:flex;flex-direction:column;gap:8px;overflow:hidden;}
.spot-legend .row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;gap:8px;}
.spot-legend .row .k{display:flex;align-items:center;gap:7px;opacity:.88;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.spot-legend .row .k i{width:8px;height:8px;border-radius:3px;flex:none;}
.spot-legend .row b{font-family:var(--font-dp);flex:none;}
.spot-stats{display:flex;flex-direction:column;flex:1;justify-content:center;gap:2px;}
.spot-stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:11.5px;}
.spot-stat-row:last-child{border-bottom:none;}
.spot-stat-row b{font-family:var(--font-dp);}
.hl-t{font-size:12.5px;font-weight:700;line-height:1.3;}
.hl-d{font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:500;line-height:1.4;}
.hl-go{margin-left:auto;flex:none;color:var(--muted);font-size:14px;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;}
.info-item{background:var(--sunk);border-radius:14px;padding:11px 12px;}
.info-item .il{font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;}
.info-item .iv{font-size:12.5px;font-weight:700;margin-top:4px;line-height:1.3;}

.who{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair);gap:10px;}
.who:last-child{border-bottom:none;}
.namechip{display:flex;flex-wrap:wrap;gap:6px;}
.namechip .nc{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--sunk);font-size:11.5px;font-weight:700;}
.namechip .nc i{width:6px;height:6px;border-radius:999px;flex:none;}
.namechip .nc.full i{background:var(--gold);}
.namechip .nc.partial i{background:var(--violet);}

.attend-cols{display:grid;grid-template-columns:1fr 1fr;margin-top:2px;}
.attend-col:first-child{padding-right:12px;border-right:1px solid var(--hair);}
.attend-col:last-child{padding-left:12px;}
.attend-chead{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px;margin-bottom:2px;border-bottom:1.5px solid var(--ink);}
.attend-r{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 0;border-bottom:1px solid var(--hair);}
.attend-r:last-child{border-bottom:none;}
.attend-r .nm{font-size:12px;font-weight:700;line-height:1.25;}
.attend-r .badge{font-size:8.5px;font-weight:800;padding:3px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;flex:none;white-space:nowrap;}
.attend-r .badge.full{background:var(--gold-bg);color:var(--gold-ink);}
.attend-r .badge.partial{background:#EAEAFB;color:var(--violet);}
.sf-item{display:flex;flex-direction:column;gap:5px;}
.sf-item label{font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
.lock-row{background:var(--sunk);border-radius:16px;padding:12px;margin-bottom:9px;}
.lock-row .lm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.lock-row .lm-field label{display:block;font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.lock-row input[type=text]{width:100%;padding:11px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--hair);font-size:13.5px;font-weight:700;}
.lock-row input[type=text]:focus{outline:none;border-color:var(--gold-ink);}
.lock-row .lm-bottom{display:flex;gap:8px;align-items:center;}
.lock-row .lm-bottom .lm-field{flex:1;}
.lock-row .lm-bottom .money{width:100%;background:var(--surface);border:1.5px solid var(--hair);}
.lock-tag{flex:none;font-size:9.5px;font-weight:800;color:var(--muted);padding:4px 2px;text-align:center;white-space:nowrap;}
.field{margin-bottom:13px;}
.field:last-child{margin-bottom:0;}
.field > label{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px;}
.field input[type=text],.field input[type=date],.field select{
  width:100%;padding:12px 13px;border:1.5px solid transparent;border-radius:var(--r-field);
  background:var(--sunk);font-size:14.5px;font-weight:500;transition:border-color .15s,background .15s;}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold-ink);background:var(--surface);}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238A8172' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px !important;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.money{display:flex;align-items:center;background:var(--sunk);border:1.5px solid transparent;border-radius:var(--r-field);transition:border-color .15s,background .15s;overflow:hidden;}
.money:focus-within{border-color:var(--gold-ink);background:var(--surface);}
.money .cur{padding-left:13px;font-size:11.5px;font-weight:800;color:var(--muted);flex:none;}
.money input{flex:1;min-width:0;width:100%;border:none;background:transparent;padding:12px 13px;text-align:right;
  font-family:var(--font-dp);font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:700;}
.money input:focus{outline:none;}
.money.sm .cur{padding-left:10px;font-size:10.5px;}
.money.sm input{padding:9px 10px;font-size:13.5px;}

.btn{width:100%;padding:14px;border-radius:var(--r-field);font-size:14.5px;font-weight:800;transition:transform .1s,opacity .15s;}
.btn:active{transform:scale(.985);}
.btn[disabled]{opacity:.5;pointer-events:none;}
.btn-gold{background:var(--gold);color:#241a03;}
.btn-onyx{background:var(--onyx);color:#fff;}

.money input{flex:1;min-width:0;width:100%;border:none;background:transparent;padding:12px 13px;text-align:right;font-family:var(--font-dp);font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:700}
.money input:focus{outline:none}
.money.sm .cur{padding-left:10px;font-size:10.5px}
.money.sm input{padding:9px 10px;font-size:13.5px}
.slotrow{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.slotrow input[type=text],.slotrow select{flex:1;min-width:0;padding:11px 12px;border-radius:var(--r-field);background:var(--sunk);border:1.5px solid transparent;font-size:13.5px;font-weight:600}
.slotrow input:focus,.slotrow select:focus{outline:none;border-color:var(--gold-ink)}
.slotrow .fee{font-size:11px;color:var(--muted);font-weight:800;flex:none;width:64px;text-align:right}
.iconbtn{width:32px;height:32px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.iconbtn:active{background:var(--gold);color:#191204}
.dynrow{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.dynrow .grow{flex:1;min-width:0}
.dynrow select{padding:11px 12px;font-size:13px}
.sub-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-2px 0 10px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.sf-item label{font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.sub-fields input,.sub-fields select{padding:10px 11px;border-radius:10px;background:var(--sunk);border:1.5px solid transparent;font-size:12.5px;font-weight:600}
/* ---------- tombol ---------- */
.btn{width:100%;padding:14px;border-radius:var(--r-field);font-size:14.5px;font-weight:800;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#241a03;box-shadow:0 6px 18px rgba(201,162,75,.25)}
.btn-onyx{background:var(--sunk);border:1px solid var(--line);color:var(--ink)}
.btn-ghost{background:var(--sunk);border:1px solid var(--line);color:var(--ink-2);font-weight:700;padding:12px;font-size:13px}
.btn-sm{padding:8px 12px;width:auto;font-size:12px;border-radius:10px}
/* ---------- riwayat ---------- */
.filters{display:flex;gap:9px;margin-bottom:12px}
.filters select{flex:1;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.scard{flex:0 0 78%;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--sh-1)}
.sd{font-size:12.5px;font-weight:800}
.sl{font-size:10px;color:var(--muted);font-weight:600;margin-top:1px}
.srow{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:var(--ink-2)}
.srow b{font-size:12.5px}
.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:none}
.ket{font-size:13.5px;font-weight:700;line-height:1.3}
.meta{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:500}
.amt{font-size:13.5px;font-weight:800;white-space:nowrap}
.amt.in{color:var(--net-ink)}.amt.out{color:var(--miss-ink)}
.del{color:var(--muted);font-size:15px;padding:5px 2px 5px 6px;opacity:.6}
/* ---------- siklus ---------- */
.siklus-card{border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:12px;background:var(--sunk)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px}
.st{font-size:13px;font-weight:800}
.tag{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tag.ok{background:var(--net-bg);color:var(--net-ink)}
.tag.watch{background:var(--gold-bg);color:var(--gold-ink)}
.lm-rows{display:flex;flex-direction:column;gap:8px}
.lock-row{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px}
.lm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.lm-field label{display:block;font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.lock-row input[type=text]{width:100%;padding:11px 12px;border-radius:10px;background:var(--sunk);border:1.5px solid transparent;font-size:13.5px;font-weight:700}
.lm-bottom{display:flex;gap:8px;align-items:center}
.lm-bottom .lm-field{flex:1}
.sk-slots,.draft-rows{display:flex;flex-direction:column}
/* ---------- pengaturan & lain ---------- */
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);transition:.18s}
.seg button.active{background:var(--surface);color:var(--gold-2);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sync-ok{color:var(--net-ink)!important;font-weight:700!important}
.sync-bad{color:var(--miss-ink)!important;font-weight:700!important}
.tipnext{color:var(--gold-ink);font-size:11.5px;font-weight:800}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
pre#sql-box{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:10px;line-height:1.5;overflow-x:auto;white-space:pre}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(94px + env(safe-area-inset-bottom));background:var(--gold);color:#191204;padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:800;z-index:60;opacity:0;transition:.22s;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:flex;align-items:center;justify-content:center;height:70vh;color:var(--muted);font-size:13px}
.empty{text-align:center;padding:34px 12px;color:var(--muted);font-size:13px;font-weight:500;line-height:1.6}
.wk-slide{max-height:300px;overflow-y:auto}
</style>

function skLabel(mulaiStr,excludeId){
  const [y,m]=mulaiStr.split('-').map(Number);
  const base=`Siklus ${MONFULL[m-1]} - ${y}`;
  const clash=STATE.siklus && STATE.siklus.some(s=>s.id!==excludeId && s.label===base);
  if(!clash) return base;
  let n=2, cand=`${base} (${n})`;
  while(STATE.siklus.some(s=>s.id!==excludeId && s.label===cand)){ n++; cand=`${base} (${n})`; }
  return cand;
}

  if(n>=1000000) return (n/1000000).toFixed(n%1000000===0?0:1).replace('.',',')+'jt';
  if(n>=1000) return Math.round(n/1000)+'rb';
  return n?String(n):'0';
}
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const MONFULL=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
function moLabelPanjang(k){ const [y,m]=k.split('-'); return `${MONFULL[Number(m)-1]} ${y}`; }
function dLabel(d){ const dt=new Date(d+"T00:00:00"); return `${dt.getDate()} ${MON[dt.getMonth()]}`; }
function dLabelFull(d){ const dt=new Date(d+"T00:00:00"); return `${HARI[dt.getDay()]}, ${dt.getDate()} ${MONFULL[dt.getMonth()]} ${dt.getFullYear()}`; }
function longDate(d){ return `${HARI[d.getDay()]}, ${d.getDate()} ${MONFULL[d.getMonth()]} ${d.getFullYear()}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

const KEYS=['pool','siklus','sesi','transactions','galeri','settings'];
async function loadAll(){
  try{ const v=await store.get('pool'); STATE.pool=v?JSON.parse(v.value):[]; }catch(e){ STATE.pool=[]; }
  try{ const v=await store.get('siklus'); STATE.siklus=v?JSON.parse(v.value):[]; }catch(e){ STATE.siklus=[]; }
  try{ const v=await store.get('sesi'); STATE.sesi=v?JSON.parse(v.value):[]; }catch(e){ STATE.sesi=[]; }
  try{ const v=await store.get('transactions'); STATE.transactions=v?JSON.parse(v.value):[]; }catch(e){ STATE.transactions=[]; }
  try{ const v=await store.get('galeri'); STATE.galeri=v?JSON.parse(v.value):[]; }catch(e){ STATE.galeri=[]; }
  try{ const v=await store.get('settings'); STATE.settings=v?JSON.parse(v.value):null; }catch(e){ STATE.settings=null; }
  try{ const v=await store.get('settingsAt'); STATE.settingsAt=v?Number(v.value)||0:0; }catch(e){ STATE.settingsAt=0; }
  loadSyncCfg();
  STATE.syncAt=Number(_lsGet('kbr:syncAt')||0)||0;
  let seedVer=null;
  try{ const v=await store.get('seedVersion'); seedVer=v?v.value:null; }catch(e){}
  if(seedVer!==SEED_VERSION){
    const d=seedData();
    STATE.pool=d.pool; STATE.siklus=d.siklus; STATE.sesi=d.sesi; STATE.transactions=d.transactions;
    STATE.galeri=d.galeri; STATE.settings=d.settings;
    await saveAll();
    try{ await store.set('seedVersion',SEED_VERSION); }catch(e){}
  }
  if(!STATE.settings) STATE.settings=seedData().settings;
  let migrated=false;
  STATE.transactions.forEach(t=>{
    if(t.kategori==='Iuran Full' && !t.sesiId && t.siklusId){
      const sid=sesiPertamaSiklusId(t.siklusId);
      if(sid){ t.sesiId=sid; t.updatedAt=Date.now(); migrated=true; }
    }
  });
  if(migrated){ await saveKey('transactions'); if(syncReady()) syncNow(true); }
  STATE.ready=true;
}
async function saveKey(k){
  try{
    if(k==='settings') STATE.settingsAt=Date.now();
    await store.set(k,JSON.stringify(STATE[k]));
    if(k==='settings') await store.set('settingsAt',String(STATE.settingsAt));
  }catch(e){ console.error(e); toast('Gagal menyimpan.'); }
  scheduleSync();
}
async function saveAll(){ for(const k of KEYS) await saveKey(k); }

function saldoTotal(){ return STATE.transactions.reduce((s,t)=>s+(t.jenis==='Masuk'?Number(t.jumlah):-Number(t.jumlah)),0); }
function saldoSampai(tgl){ return STATE.transactions.filter(t=>t.tanggal<=tgl).reduce((s,t)=>s+(t.jenis==='Masuk'?Number(t.jumlah):-Number(t.jumlah)),0); }
function sesiTx(sid){ return STATE.transactions.filter(t=>t.sesiId===sid); }
function isTxSiklusPenuh(t){ return t.kategori==='Iuran Full' || (t.kategori==='Sewa Lapangan' && t.jenisLapangan==='Member'); }
function sesiTotalsRutin(sid){
  const l=sesiTx(sid).filter(t=>!isTxSiklusPenuh(t));
  const masuk=l.filter(t=>t.jenis==='Masuk').reduce((s,t)=>s+Number(t.jumlah),0);
  const keluar=l.filter(t=>t.jenis==='Keluar').reduce((s,t)=>s+Number(t.jumlah),0);
  return {masuk,keluar,net:masuk-keluar};
}
function sesiTotals(sid){
  const l=sesiTx(sid);
  const masuk=l.filter(t=>t.jenis==='Masuk').reduce((s,t)=>s+Number(t.jumlah),0);
  const keluar=l.filter(t=>t.jenis==='Keluar').reduce((s,t)=>s+Number(t.jumlah),0);
  return {masuk,keluar,net:masuk-keluar};
}
function sesiUrut(){ return [...STATE.sesi].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)); }
function sesiPertamaSiklusId(siklusId){
  const l=STATE.sesi.filter(se=>se.siklusId===siklusId).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
  return l.length?l[0].id:null;
}
function siklusUrut(){ return [...STATE.siklus].sort((a,b)=>String(a.mulai).localeCompare(String(b.mulai))); }
function activeSiklus(){ const u=siklusUrut(); return u[u.length-1]; }
function siklusLunasInfo(sk){
  const total=sk.full.length, lunas=sk.full.filter(f=>f.lunas).length;
  const terkumpul=sk.full.filter(f=>f.lunas).reduce((s,f)=>s+Number(f.jumlah),0);
  const potensi=sk.full.reduce((s,f)=>s+Number(f.jumlah),0);
  return {total,lunas,belum:total-lunas,terkumpul,potensi};
}
function statusKas(kas,avgKeluar){
  if(kas<0) return 'DEFISIT';
  if(avgKeluar>0 && kas<avgKeluar) return 'KETAT';
  return 'AMAN';
}
function courtBookingsOf(se){ return (se&&se.biaya||[]).filter(b=>b.kategori==='Sewa Lapangan'); }
function durasiJamText(jam){
  if(!jam) return '';
  const m=/(\d{1,2})[.:](\d{2})\s*-\s*(\d{1,2})[.:](\d{2})/.exec(jam);
  if(!m) return '';
  const start=Number(m[1])+Number(m[2])/60, end=Number(m[3])+Number(m[4])/60;
  let d=end-start; if(d<=0) d+=24;
  const r=Math.round(d*100)/100;
  return (r%1===0?r:r.toFixed(1))+' jam';
}

/* =================== Input nominal =================== */
function moneyVal(el){ return Number(String(el.value).replace(/\D/g,''))||0; }
function reformatMoney(el){
  const raw=el.value, caret=el.selectionStart==null?raw.length:el.selectionStart;
  const db=raw.slice(0,caret).replace(/\D/g,'').length;
  const digits=raw.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
  const out=digits?Number(digits).toLocaleString('id-ID'):'';
  el.value=out;
  let c=0,pos=out.length;
  if(db===0) pos=0; else for(let i=0;i<out.length;i++){ if(/\d/.test(out[i])) c++; if(c===db){ pos=i+1; break; } }
  try{ el.setSelectionRange(pos,pos); }catch(e){}
}

}

  let el=document.getElementById('toast');

/* =================== Auto-rotating rail helper =================== */
function attachAutoRail(railSel,dotsSel,count,intervalMs,stateKey){
  const rail=root.querySelector(railSel); if(!rail||count<2) return;
  const dots=dotsSel?[...root.querySelectorAll(dotsSel+' i')]:[];
  const step=()=>rail.firstElementChild? rail.firstElementChild.getBoundingClientRect().width+10 : 1;
  let idx=STATE[stateKey]||0;
  const goTo=(i)=>{ idx=((i%count)+count)%count; STATE[stateKey]=idx; rail.scrollTo({left:idx*step(),behavior:'smooth'}); dots.forEach((d,j)=>d.classList.toggle('on',j===idx)); };
  goTo(idx);
  AUTO_TIMERS[railSel]=setInterval(()=>goTo(idx+1),intervalMs);
  const pause=()=>{ clearInterval(AUTO_TIMERS[railSel]); };
  const resume=()=>{ clearInterval(AUTO_TIMERS[railSel]); AUTO_TIMERS[railSel]=setInterval(()=>goTo(idx+1),intervalMs); };
  rail.addEventListener('pointerdown',pause);
  rail.addEventListener('pointerup',resume);
  rail.addEventListener('scroll',()=>{ const i=Math.round(rail.scrollLeft/step()); if(i!==idx){ idx=((i%count)+count)%count; STATE[stateKey]=idx; dots.forEach((d,j)=>d.classList.toggle('on',j===idx)); } },{passive:true});
}

const KOMPOSISI_COLORS={'Sewa Lapangan':'var(--gold)','Shuttlecock':'var(--violet)','Lainnya (Pengeluaran)':'var(--miss)'};
function seededIdx(salt,n){ if(!n) return 0; const s=todayStr()+'|'+salt; let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h%n; }
function transaksiPeriodeAktif(){
  const sk=activeSiklus();
  if(!sk) return STATE.transactions;
  const sesiIds=new Set(STATE.sesi.filter(se=>se.siklusId===sk.id).map(se=>se.id));
  return STATE.transactions.filter(t=>t.siklusId===sk.id||sesiIds.has(t.sesiId));
}
function totalPeriodeAktif(){
  const txs=transaksiPeriodeAktif();
  const masuk=txs.filter(t=>t.jenis==='Masuk').reduce((s,t)=>s+Number(t.jumlah),0);
  const keluar=txs.filter(t=>t.jenis==='Keluar').reduce((s,t)=>s+Number(t.jumlah),0);
  return {masuk,keluar,net:masuk-keluar};
}
function keluarPeriodeAktif(){
  const sk=activeSiklus();
  if(!sk) return STATE.transactions.filter(t=>t.jenis==='Keluar');
  const sesiIds=new Set(STATE.sesi.filter(se=>se.siklusId===sk.id).map(se=>se.id));
  return STATE.transactions.filter(t=>t.jenis==='Keluar'&&(t.siklusId===sk.id||sesiIds.has(t.sesiId)));
}
function komposisiPengeluaran(){
  const txs=keluarPeriodeAktif();
  const map={};
  txs.forEach(t=>{ const k=t.kategori||'Lainnya (Pengeluaran)'; map[k]=(map[k]||0)+Number(t.jumlah||0); });
  const total=Object.values(map).reduce((a,b)=>a+b,0);
  const rows=Object.entries(map).map(([k,v])=>({kategori:k,jumlah:v,pct:total?Math.round(v/total*100):0})).sort((a,b)=>b.jumlah-a.jumlah);
  return {rows,total};
}
function sorotanPeriode(){
  const sk=activeSiklus();
  const sesiPeriode=sesiUrut().filter(se=>!sk||se.siklusId===sk.id);
  const totalMasuk=sesiPeriode.reduce((s,se)=>s+sesiTotals(se.id).masuk,0);
  const totalKeluar=sesiPeriode.reduce((s,se)=>s+sesiTotals(se.id).keluar,0);
  const freq={};
  sesiPeriode.forEach(se=>se.partial.forEach(p=>{ const nm=(p.nama||'').trim(); if(nm) freq[nm]=(freq[nm]||0)+1; }));
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  return {label:sk?sk.label:'Semua periode',sesiCount:sesiPeriode.length,totalMasuk,totalKeluar,net:totalMasuk-totalKeluar,topPartial:top?{nama:top[0],kali:top[1]}:null};
}

/* =================== Home (Ringkasan + Beranda digabung) =================== */
function renderHome(today){
  const urut=sesiUrut();
  const kas=saldoTotal();
  const avgKeluar = urut.length? urut.reduce((s,se)=>s+sesiTotalsRutin(se.id).keluar,0)/urut.length : 0;
  const status=statusKas(kas,avgKeluar);
  const statusTxt={AMAN:'Aman',KETAT:'Ketat',DEFISIT:'Defisit'}[status];

  const last=urut[urut.length-1];
  const arusTerakhir= last? sesiTotals(last.id) : {masuk:0,keluar:0,net:0};

  const win=urut.slice(-8);
  const maxVal=Math.max(...win.map(se=>{ const t=sesiTotals(se.id); return Math.max(t.masuk,t.keluar); }),1);
  const winTotalMasuk=win.reduce((s,se)=>s+sesiTotals(se.id).masuk,0);
  const winTotalKeluar=win.reduce((s,se)=>s+sesiTotals(se.id).keluar,0);
  const combars = win.length ? `
    <div class="kastot">
      <div class="kt"><div class="kl">Total pemasukan</div><div class="kv num up">${fmtRp(winTotalMasuk)}</div></div>
      <div class="kt"><div class="kl">Total pengeluaran</div><div class="kv num down">${fmtRp(winTotalKeluar)}</div></div>
    </div>
    <div class="combars">${win.map(se=>{ const t=sesiTotals(se.id);
      const hin=Math.max(3,Math.round(t.masuk/maxVal*100)), hout=Math.max(3,Math.round(t.keluar/maxVal*100));
      return `<div class="col"><div class="grp"><i class="in" style="height:${hin}%"></i><i class="out" style="height:${hout}%"></i></div>
        <div class="colval"><b class="up">${fmtRingkas(t.masuk)}</b><b class="down">${fmtRingkas(t.keluar)}</b></div></div>`;
    }).join('')}</div>
    <div class="axis" style="margin-top:2px;"><span>${dLabel(win[0].tanggal)}</span><span>${dLabel(win[win.length-1].tanggal)}</span></div>
    <div class="legend-mini"><span><i style="background:var(--net)"></i>Pemasukan</span><span><i style="background:var(--miss);opacity:.7"></i>Pengeluaran</span></div>`
    : `<div class="empty" style="padding:20px 0;">Belum ada sesi tercatat.</div>`;

  const skAktif=siklusUrut().slice(-1)[0];
  const totalPeriode=totalPeriodeAktif();
  const totalPeriodeCard=skAktif?`<div class="card" style="border:1.5px solid var(--net);">
      <h3>Total kas ${esc(skAktif.label)}</h3>
      <div class="csub">Semua transaksi sejak siklus ini dimulai — termasuk pelunasan member full &amp; sewa lapangan member. Untuk total semua siklus (all-time), buka tab Riwayat.</div>
      <div class="duo" style="margin-top:2px;">
        <div class="tile"><div class="l">Total pemasukan</div><div class="v num up">${fmtRp(totalPeriode.masuk)}</div></div>
        <div class="tile"><div class="l">Total pengeluaran</div><div class="v num down">${fmtRp(totalPeriode.keluar)}</div></div>
      </div>
    </div>`:'';
  let iuranCard='';
  if(skAktif){
    const info=siklusLunasInfo(skAktif);
    const belum=skAktif.full.filter(f=>!f.lunas);
    iuranCard=`<div class="card">
      <h3>${esc(skAktif.label)}</h3>
      <div class="csub">Total uang bergerak dari iuran full anggota</div>
      <div class="duo" style="margin-top:2px;">
        <div class="tile"><div class="l">Terkumpul</div><div class="v num up">${fmtRp(info.terkumpul)}</div></div>
        <div class="tile"><div class="l">Potensi total</div><div class="v num">${fmtRp(info.potensi)}</div></div>
      </div>
      <div class="tiny">${info.lunas} dari ${info.total} anggota sudah bayar.</div>
      ${belum.length? `<div class="namechip" style="margin-top:10px;">${belum.map(m=>`<span class="nc full"><i></i>${esc(m.nama||'(kosong)')}</span>`).join('')}</div>`
        : `<div class="tiny" style="margin-top:8px;">Semua anggota full siklus ini sudah lunas.</div>`}
    </div>`;
  }

  let hadirCard='';
  if(last){
    const partials=last.partial.map(p=>p.nama);
    const partialSet=new Set(partials);
    const fulls=last.hadirFull.map(h=>h.nama).filter(nm=>!partialSet.has(nm));
    hadirCard=`<div class="card">
      <h3>Kehadiran sesi terakhir</h3>
      <div class="csub">${dLabelFull(last.tanggal)} · ${fulls.length+partials.length} orang hadir</div>
      ${(fulls.length||partials.length)?`<div class="attend-cols">
        <div class="attend-col">
          <div class="attend-chead">Full · ${fulls.length}</div>
          ${fulls.length?fulls.map(nm=>`<div class="attend-r"><span class="nm">${esc(nm)}</span><span class="badge full">Full</span></div>`).join(''):`<div class="tiny">Tidak ada.</div>`}
        </div>
        <div class="attend-col">
          <div class="attend-chead">Partial · ${partials.length}</div>
          ${partials.length?partials.map(nm=>`<div class="attend-r"><span class="nm">${esc(nm)}</span><span class="badge partial">Partial</span></div>`).join(''):`<div class="tiny">Tidak ada.</div>`}
        </div>
      </div>`:`<div class="empty">Belum ada yang tercatat hadir.</div>`}
    </div>`;
  }

  const skAktif2=(last&&last.siklusId&&STATE.siklus.find(s=>s.id===last.siklusId))||activeSiklus();
  const memberCourts=skAktif2?(skAktif2.lapanganMember||[]):[];
  const lokasiAktif=(skAktif2&&skAktif2.lokasi)||(last&&last.lokasi)||STATE.settings.lokasi;
  const extraCourts=last?courtBookingsOf(last).filter(b=>b.jenisLapangan!=='Member'):[];
  let lapCard='';
  if(memberCourts.length||extraCourts.length||last){
    lapCard=`<div class="card">
      <h3>Lapangan sesi terakhir</h3>
      <div class="csub">${esc(lokasiAktif||'Lokasi belum diatur')}</div>
      ${memberCourts.length?`<div class="slabel" style="margin:0 0 8px;">Lapangan member (siklus berjalan)</div>
        <div class="info-grid">${memberCourts.map(c=>{ const dur=durasiJamText(c.jam);
          return `<div class="info-item"><div class="il">${esc(c.noLapangan||'Lapangan')}</div><div class="iv">${esc(c.jam||'jam belum diisi')}${dur?` · ${dur}`:''}</div><div class="tiny" style="margin-top:3px;">Member</div></div>`; }).join('')}</div>`:''}
      ${extraCourts.length?`<div class="slabel" style="margin:${memberCourts.length?14:0}px 0 8px;">Lapangan tambahan sesi ini</div>
        <div class="info-grid">${extraCourts.map(b=>{ const dur=durasiJamText(b.jam);
          return `<div class="info-item"><div class="il">${esc(b.noLapangan||'Lapangan')}</div><div class="iv">${esc(b.jam||'-')}${dur?` · ${dur}`:''}</div><div class="tiny" style="margin-top:3px;">${esc(b.jenisLapangan||'Non-Member')}</div></div>`; }).join('')}</div>`:''}
      ${!memberCourts.length&&!extraCourts.length?`<div class="tiny">Belum ada rincian lapangan. Atur lapangan member di tab Anggota.</div>`:''}
      <div class="tiny" style="margin-top:10px;">Lapangan member berlaku selama siklus ini dan tetap tampil di sini sampai siklus baru dimulai — atur di tab Anggota.</div>
    </div>`;
  }

  const partialWin=win.slice(-6).map(se=>{
    const total=se.partial.reduce((s,p)=>s+Number(p.jumlah||0),0);
    return {tanggal:se.tanggal,orang:se.partial.length,total};
  });
  const partialCard=partialWin.length?`<div class="card">
      <h3>Pemasukan member partial per minggu</h3>
      <div class="csub">Total iuran dari member partial saja, per sesi</div>
      ${partialWin.map(x=>`<div class="line"><span class="k">${dLabel(x.tanggal)} · ${x.orang} orang</span><span class="v num up">${fmtRp(x.total)}</span></div>`).join('')}
    </div>`:'';

  const galeri=[...STATE.galeri].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  return `
    <section class="hero">
      ${COURT_SVG}
      <div class="toprow">
        <div>
          <div class="eyebrow">Kas ${esc(STATE.settings.pbName)}${last?' · per '+dLabel(last.tanggal):''}</div>
          <div class="big num">${fmtRp(kas)}</div>
        </div>
        <span class="pill ${status}">${statusTxt}</span>
      </div>
    </section>

    <div class="railhead"><span class="rt">Sorotan</span><span class="rs">geser untuk lihat semua</span></div>
    <div class="rail" id="spot-rail">${renderSpotlightSlides()}</div>
    <div class="dots-mini" id="spot-dots">${[0,1,2,3,4].map(i=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>

    ${totalPeriodeCard}

    <div class="duo">
      <div class="tile"><div class="l">Kas masuk (sesi terakhir)</div><div class="v num up">${fmtRp(arusTerakhir.masuk)}</div></div>
      <div class="tile"><div class="l">Kas keluar (sesi terakhir)</div><div class="v num down">${fmtRp(arusTerakhir.keluar)}</div></div>
    </div>

    <div class="card">
      <h3>Pergerakan kas</h3>
      <div class="csub">Pemasukan vs pengeluaran per sesi (${win.length} sesi terakhir) — termasuk iuran full &amp; sewa lapangan member, tercatat di sesi pertama siklus</div>
      ${combars}
    </div>

    ${hadirCard}
    ${lapCard}
    ${iuranCard}
    ${partialCard}

    <div class="railhead"><span class="rt">Galeri</span><span class="rs">${galeri.length} foto</span></div>
    <div class="rail" id="galeri-rail">
      <div class="upload-tile" id="btn-upload-foto">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Unggah foto pertama
      </div>
      ${galeri.map(g=>`<div class="gslide">
          <img src="${g.dataUrl}" alt="${esc(g.caption||'foto')}"/>
          <div class="gcap">${esc(g.caption||dLabel(g.tanggal||todayStr()))}</div>
          <button type="button" class="gdel" data-del-foto="${g.id}">✕</button>
        </div>`).join('')}
    </div>
    ${galeri.length>1?`<div class="dots-mini" id="galeri-dots">${galeri.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}
    <input type="file" id="file-foto" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;"/>
    <div class="tiny" style="margin:4px 4px 16px;">Foto dikompres otomatis. Maksimal 12 foto tersimpan.</div>

    <div class="slabel">Highlight seputar badminton</div>
    ${['YouTube','Instagram'].map(g=>`<div class="hlgroup"><div class="hgt">${g}</div>
      <div class="card">${HIGHLIGHTS.filter(h=>h.group===g).map(h=>`<a class="hl-card" href="${h.url}" target="_blank" rel="noopener">
          <span class="hl-thumb ${h.platform}">
            <span class="fallback-ic">${h.platform==='yt'?ICON_YT:ICON_IG}</span>
            ${h.platform==='yt'?`<img src="${h.thumb}" alt="" loading="lazy" onerror="this.style.display='none'"/>`:''}
            <img class="badge" src="${LOGO_URI}" alt=""/>
            <span class="plat ${h.platform}">${h.platform==='yt'?ICON_YT:ICON_IG}</span></span>
          <span><div class="hl-t">${esc(h.title)}</div><div class="hl-d">${esc(h.desc)}</div></span>
          <span class="hl-go">↗</span>
        </a>`).join('')}</div></div>`).join('')}`;
}

/* =================== Sesi (input) =================== */
function newSesiForm(){
  const sk=activeSiklus();
  return { tanggal: todayStr(), lokasi: (sk&&sk.lokasi)||STATE.settings.lokasi,
    hadirFull:[], partial:[{nama:'',jumlah:STATE.settings.tarifPartial},{nama:'',jumlah:STATE.settings.tarifPartial},{nama:'',jumlah:STATE.settings.tarifPartial}],
    biaya:[],
    masukLain:[] };
}
function newCalcTambahan(){ return {lokasi:'',tanggal:todayStr(),hargaLapangan:0,durasi:'',jumlahOrang:0,hargaShuttlecock:0}; }
function renderSesiForm(){
  if(!STATE.sesiForm) STATE.sesiForm=newSesiForm();
  const f=STATE.sesiForm;

  const partialTerisi=f.partial.filter(p=>p.nama.trim()).length;
  const partialFee=f.partial.filter(p=>p.nama.trim()).reduce((s,p)=>s+(Number(p.jumlah)||0),0);
  const biayaTotal=f.biaya.reduce((s,b)=>s+(Number(b.jumlah)||0),0);
  const masukLainTotal=f.masukLain.reduce((s,b)=>s+(Number(b.jumlah)||0),0);
  const totalMasuk=partialFee+masukLainTotal;
  const netSesi=totalMasuk-biayaTotal;
  const kasSebelum=saldoTotal();
  const hadirFullTerisi=f.hadirFull.filter(h=>h.nama.trim()).length;
  const skAktifSF=activeSiklus();
  const memberCourtsSF=skAktifSF?(skAktifSF.lapanganMember||[]):[];

  return `
    ${poolDatalist()}
    <div class="slabel">Catat sesi main (Sabtu rutin)</div>
    <div class="note">Member partial berbeda tiap minggu — catat di bawah. Iuran &amp; lapangan member dikelola per siklus di tab Anggota, jadi tidak perlu diisi ulang tiap minggu.</div>
    <div class="card">
      <div class="field"><label>Tanggal</label><input id="sf-tanggal" type="date" value="${f.tanggal}"/></div>
      <div class="field"><label>Lokasi</label><input id="sf-lokasi" type="text" placeholder="Nama GOR" value="${esc(f.lokasi)}"/></div>
      ${memberCourtsSF.length?`<div class="tiny" style="margin-top:10px;">Lapangan member siklus ini: ${memberCourtsSF.map(c=>`${esc(c.noLapangan||'Lapangan')} (${esc(c.jam||'jam belum diisi')})`).join(', ')}. Sudah dibayar untuk seluruh siklus — tidak perlu dicatat ulang di sini.</div>`
        :`<div class="tiny" style="margin-top:10px;">Belum ada lapangan member untuk siklus berjalan. Atur di tab Anggota.</div>`}
    </div>

    <div class="card">
      <h3>Member full hadir</h3>
      <div class="csub">Untuk catatan kehadiran saja — iuran tidak dipungut di sini.</div>
      <div id="hfull-rows">${f.hadirFull.map((h,i)=>`<div class="slotrow" data-hfrow="${i}">
          <input type="text" list="dl-pool" placeholder="Nama ${i+1}" data-hfnama="${i}" value="${esc(h.nama)}"/>
          <button type="button" class="iconbtn" data-hfdel="${i}">✕</button>
        </div>`).join('')}</div>
      <button type="button" class="btn btn-ghost" id="btn-hfull-add">+ Tambah anggota full hadir</button>
      <div class="tiny" style="margin-top:10px;">${hadirFullTerisi} anggota full tercatat hadir.</div>
    </div>

    <div class="card">
      <h3>Member partial hadir</h3>
      <div class="csub">Rp${fmtNum(STATE.settings.tarifPartial)}/sesi. Kosongkan slot yang tidak dipakai.</div>
      <div id="partial-rows">${f.partial.map((p,i)=>`<div class="slotrow" data-prow="${i}">
          <input type="text" list="dl-pool" placeholder="Nama ${i+1}" data-pnama="${i}" value="${esc(p.nama)}"/>
          <span class="fee num">Rp${fmtNum(p.jumlah)}</span>
          <button type="button" class="iconbtn" data-pdel="${i}">✕</button>
        </div>`).join('')}</div>
      <button type="button" class="btn btn-ghost" id="btn-partial-add">+ Tambah slot partial</button>
      <div class="tiny" style="margin-top:10px;">${partialTerisi} orang terisi · iuran partial ${fmtRp(partialFee)}</div>
    </div>

    <div class="card">
      <h3>Biaya operasional</h3>
      <div class="csub">Shuttlecock atau lapangan tambahan (non-member) di luar lapangan member siklus — jam &amp; jenisnya dicatat lewat form, bukan lewat keterangan.</div>
      <div id="biaya-rows">${f.biaya.map((b,i)=>`
        <div class="dynrow" data-brow="${i}"><select class="grow" data-bkat="${i}">${KATEGORI_KELUAR.map(k=>`<option ${k===b.kategori?'selected':''}>${k}</option>`).join('')}</select></div>
        ${b.kategori==='Sewa Lapangan'?`<div class="sub-fields">
            <div class="sf-item"><label>Jenis lapangan</label><select data-bjenis="${i}">${JENIS_LAP.map(j=>`<option ${j===b.jenisLapangan?'selected':''}>${j}</option>`).join('')}</select></div>
            <div class="sf-item"><label>No. lapangan</label><input type="text" placeholder="mis. Lapangan 2" data-bno="${i}" value="${esc(b.noLapangan||'')}"/></div>
            <div class="sf-item" style="grid-column:1/-1;"><label>Jam main</label><input type="text" placeholder="mis. 10.00-12.00" data-bjam="${i}" value="${esc(b.jam||'')}"/></div>
          </div>`:''}
        <div class="dynrow" data-brow2="${i}"><input class="grow" type="text" placeholder="Keterangan" data-bket="${i}" value="${esc(b.keterangan)}"/></div>
        <div class="dynrow" data-brow3="${i}" style="margin-bottom:14px;">${moneyField(`data-bjml="${i}"`,b.jumlah,true)}<button type="button" class="iconbtn" data-bdel="${i}">✕</button></div>
      `).join('')}</div>
      <button type="button" class="btn btn-ghost" id="btn-biaya-add">+ Tambah biaya / lapangan tambahan</button>
    </div>

    <div class="card">
      <h3>Pemasukan lain</h3>
      <div class="csub">Opsional — sponsor, sisa DP, dll (di luar iuran).</div>
      <div id="masuk-rows">${f.masukLain.map((b,i)=>`
        <div class="dynrow" data-mrow="${i}"><input class="grow" type="text" placeholder="Keterangan" data-mket="${i}" value="${esc(b.keterangan)}"/></div>
        <div class="dynrow" data-mrow2="${i}" style="margin-bottom:14px;">${moneyField(`data-mjml="${i}"`,b.jumlah,true)}<button type="button" class="iconbtn" data-mdel="${i}">✕</button></div>
      `).join('')}</div>
      <button type="button" class="btn btn-ghost" id="btn-masuk-add">+ Tambah pemasukan lain</button>
    </div>

    <div class="card">
      <h3>Ringkasan sesi</h3>
      <div class="line"><span class="k">Kas sebelum sesi ini</span><span class="v num">${fmtRp(kasSebelum)}</span></div>
      <div class="line"><span class="k">Total pemasukan</span><span class="v num up">${fmtRp(totalMasuk)}</span></div>
      <div class="line"><span class="k">Total pengeluaran</span><span class="v num down">${fmtRp(biayaTotal)}</span></div>
      <div class="line"><span class="k">Kas setelah sesi ini</span><span class="v num ${(kasSebelum+netSesi)>=0?'up':'down'}">${fmtRp(kasSebelum+netSesi)}</span></div>
    </div>

    <button class="btn btn-gold" id="btn-simpan-sesi" style="margin-top:2px;">Simpan sesi</button>

    ${renderCalcTambahan()}`;
}

/* =================== Kalkulator jadwal tambahan (di luar Sabtu) =================== */
function renderCalcTambahan(){
  if(!STATE.calcTambahan) STATE.calcTambahan=newCalcTambahan();
  const c=STATE.calcTambahan;
  const total=(Number(c.hargaLapangan)||0)+(Number(c.hargaShuttlecock)||0);
  const orang=Number(c.jumlahOrang)||0;
  const perOrang=orang>0?total/orang:0;
  return `
    <div class="slabel">Jadwal tambahan (di luar Sabtu)</div>
    <div class="note info">Untuk main dadakan di luar jadwal rutin Sabtu. Biaya dipatungan langsung antar yang hadir dan tidak masuk ke kas klub — form ini hanya kalkulator pembagian per orang.</div>
    <div class="card">
      <div class="duo-f">
        <div class="field"><label>Lokasi lapangan</label><input id="ct-lokasi" type="text" placeholder="Nama GOR" value="${esc(c.lokasi)}"/></div>
        <div class="field"><label>Tanggal</label><input id="ct-tanggal" type="date" value="${c.tanggal}"/></div>
      </div>
      <div class="duo-f">
        <div class="field"><label>Harga lapangan</label>${moneyField('id="ct-harga"',c.hargaLapangan,true)}</div>
        <div class="field"><label>Durasi main</label><input id="ct-durasi" type="text" placeholder="mis. 2 jam" value="${esc(c.durasi)}"/></div>
      </div>
      <div class="duo-f">
        <div class="field"><label>Orang hadir</label><input id="ct-orang" type="text" inputmode="numeric" placeholder="0" value="${c.jumlahOrang||''}"/></div>
        <div class="field"><label>Harga shuttlecock</label>${moneyField('id="ct-shuttle"',c.hargaShuttlecock,true)}</div>
      </div>
      <div class="line"><span class="k">Total biaya</span><span class="v num">${fmtRp(total)}</span></div>
      <div class="line"><span class="k">Ideal per orang${orang?` (${orang} orang)`:''}</span><span class="v num up">${orang?fmtRp(perOrang):'—'}</span></div>
      ${orang?'':'<div class="tiny" style="margin-top:6px;">Isi jumlah orang hadir untuk melihat pembagian per orang.</div>'}
    </div>`;
}

/* =================== Riwayat =================== */
function renderRiwayat(){
  const urut=[...sesiUrut()].reverse();
  const f=STATE.riwayatFilter;
  const months=[...new Set(STATE.transactions.map(t=>t.tanggal.slice(0,7)))].sort().reverse();
  const kats=['Iuran Full','Iuran Partial',...KATEGORI_KELUAR,'Lainnya (Pemasukan)'];
  let list=[...STATE.transactions].sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||(b.createdAt||0)-(a.createdAt||0));
  if(f.bulan) list=list.filter(t=>t.tanggal.slice(0,7)===f.bulan);
  if(f.kategori) list=list.filter(t=>t.kategori===f.kategori);
  const tot={masuk:list.filter(t=>t.jenis==='Masuk').reduce((s,t)=>s+Number(t.jumlah),0),
             keluar:list.filter(t=>t.jenis==='Keluar').reduce((s,t)=>s+Number(t.jumlah),0)};

  return `
    <div class="railhead"><span class="rt">Riwayat sesi</span><span class="rs">Geser untuk lihat semua</span></div>
    <div class="rail">${urut.length?urut.map(se=>{
      const t=sesiTotals(se.id);
      return `<div class="scard">
        <div class="sd">${dLabelFull(se.tanggal)}</div>
        <div class="sl">${esc(se.lokasi)} · ${se.hadirFull.length+se.partial.length} hadir</div>
        <div class="srow"><span>Masuk</span><b class="num up">${fmtRp(t.masuk)}</b></div>
        <div class="srow"><span>Keluar</span><b class="num down">${fmtRp(t.keluar)}</b></div>
        <div class="srow"><span>Kas setelahnya</span><b class="num">${fmtRp(saldoSampai(se.tanggal))}</b></div>
        <button type="button" class="btn btn-ghost btn-sm" data-hapus-sesi="${se.id}" style="margin-top:10px;">Hapus sesi</button>
      </div>`;
    }).join(''):`<div class="empty" style="width:100%;">Belum ada sesi.</div>`}</div>

    <div class="filters">
      <select id="rf-bulan"><option value="">Semua bulan</option>${months.map(mo=>`<option value="${mo}" ${mo===f.bulan?'selected':''}>${moLabelPanjang(mo)}</option>`).join('')}</select>
      <select id="rf-kategori"><option value="">Semua kategori</option>${kats.map(k=>`<option ${k===f.kategori?'selected':''}>${k}</option>`).join('')}</select>
    </div>
    <div class="duo">
      <div class="tile"><div class="l">Pemasukan</div><div class="v num up">${fmtRp(tot.masuk)}</div></div>
      <div class="tile"><div class="l">Pengeluaran</div><div class="v num down">${fmtRp(tot.keluar)}</div></div>
    </div>
    <div class="card">
      ${list.length===0?`<div class="empty">Tidak ada transaksi pada filter ini.</div>`:list.map(t=>`<div class="tx">
          <div><div class="ket">${esc(t.keterangan||t.kategori)}</div>
          <div class="meta">${t.tanggal}${t.nama?' · '+esc(t.nama):''} · ${esc(t.kategori)}</div></div>
          <div style="display:flex;align-items:center;">
            <div class="amt ${t.jenis==='Masuk'?'in':'out'} num">${t.jenis==='Masuk'?'+':'−'}${fmtRp(t.jumlah)}</div>
            <button class="del" data-id="${t.id}" aria-label="Hapus transaksi">✕</button>
          </div></div>`).join('')}
    </div>`;
}

/* =================== Anggota (pool + siklus) =================== */
function renderAnggotaTotalTable(){
  const skAktif=activeSiklus();
  const fulls=(skAktif?skAktif.full:[]).filter(f=>(f.nama||'').trim())
    .map(f=>f.nama.trim()).sort((a,b)=>a.localeCompare(b));
  const fullNames=new Set(fulls);
  const sesiAktif=sesiUrut().filter(se=>skAktif?se.siklusId===skAktif.id:true);
  const partialSet=new Set();
  sesiAktif.forEach(se=>se.partial.forEach(p=>{ const nm=(p.nama||'').trim(); if(nm && !fullNames.has(nm)) partialSet.add(nm); }));
  const partials=[...partialSet].sort((a,b)=>a.localeCompare(b));
  const total=fulls.length+partials.length;
  return `
    <div class="slabel">Total anggota keseluruhan</div>
    <div class="card">
      <h3>${skAktif?esc(skAktif.label):'Belum ada siklus aktif'}</h3>
      <div class="csub">${total} anggota · ${fulls.length} full, ${partials.length} partial</div>
      ${total?`<div class="attend-cols">
        <div class="attend-col">
          <div class="attend-chead">Full · ${fulls.length}</div>
          ${fulls.length?fulls.map(nm=>`<div class="attend-r"><span class="nm">${esc(nm)}</span><span class="badge full">Full</span></div>`).join(''):`<div class="tiny">Belum ada.</div>`}
        </div>
        <div class="attend-col">
          <div class="attend-chead">Partial · ${partials.length}</div>
          ${partials.length?partials.map(nm=>`<div class="attend-r"><span class="nm">${esc(nm)}</span><span class="badge partial">Partial</span></div>`).join(''):`<div class="tiny">Belum ada.</div>`}
        </div>
      </div>`:`<div class="empty">Belum ada anggota tercatat.</div>`}
      <div class="tiny" style="margin-top:12px;">Full = roster siklus berjalan (tetap tercatat walau tidak selalu hadir, karena sudah kontribusi lapangan member). Partial = gabungan nama yang pernah hadir per sesi. Otomatis mengikuti siklus begitu siklus baru dimulai — riwayat siklus lama tetap tersimpan di bagian "Siklus keanggotaan" di bawah.</div>

/* =================== Galeri: kompresi foto =================== */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxW=900;
        const scale=Math.min(1,maxW/img.width);
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',0.65));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function handleFotoFiles(files){
  for(const file of files){
    try{
      const dataUrl=await compressImage(file);
      STATE.galeri.push({id:'g-'+uid(),dataUrl,caption:'',tanggal:todayStr(),createdAt:Date.now()});
    }catch(e){ console.error(e); }
  }
  STATE.galeri.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(STATE.galeri.length>12) STATE.galeri=STATE.galeri.slice(0,12);
  await saveKey('galeri'); render(); toast('Foto ditambahkan.');
}

/* =================== Ekspor / Impor Excel =================== */
const CUR='_-[$IDR]\\ * #,##0_-;\\-[$IDR]\\ * #,##0_-;_-[$IDR]\\ * "-"_-;_-@_-';
const DATE_SHORT='dd\\-mmm\\-yyyy';
const ST={
  title  :{sz:14,b:1,fc:'FFFFFFFF',bg:'FF0E0E0E'},
  note   :{sz:9,i:1,fc:'FF666666',wrap:1},
  sect   :{sz:11,b:1,fc:'FFFFFFFF',bg:'FFC9A24B'},
  head   :{sz:10,b:1,fc:'FFFFFFFF',bg:'FFE8C36E',al:'center',wrap:1,bd:1},
  cell   :{sz:10,bd:1},
  cellw  :{sz:10,wrap:1,bd:1},
  cellc  :{sz:10,al:'center',bd:1},
  bold   :{sz:10,b:1,bd:1},
  moneyr :{sz:10,al:'right',bd:1},
  total  :{sz:10,b:1,bg:'FFF3E7C9',bd:1},
};
function txt(v,st){ return {t:'s',v,st:st||'cell'}; }
function money(v,st){ return {t:'n',v:Number(v)||0,z:CUR,st:st||'cell'}; }
function dt(s,st,z){ return {t:'d',v:s,z:z||DATE_SHORT,st:st||'cellc'}; }
function colLetter(n){ let s=""; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
function refToRC(ref){ const m=/^([A-Z]+)(\d+)$/.exec(ref); let c=0; for(const ch of m[1]) c=c*26+(ch.charCodeAt(0)-64); return {r:Number(m[2])-1,c:c-1}; }
function SH(){ return {rows:[],merges:[],cols:[],heights:{}}; }
function put(sh,ref,cell){ const {r,c}=refToRC(ref); while(sh.rows.length<=r) sh.rows.push([]); const row=sh.rows[r]; while(row.length<=c) row.push(null); row[c]=cell; }
function ROW(sh,ref,cells){ const {r,c}=refToRC(ref); cells.forEach((v,i)=>{ if(v!==undefined&&v!==null) put(sh,colLetter(c+1+i)+(r+1),v); }); }
function banner(sh,ref,text,lastCol,style,h){
  put(sh,ref,txt(text,style)); const {r,c}=refToRC(ref);
  sh.merges.push(`${ref}:${lastCol}${r+1}`);
  for(let x=c+2;x<=refToRC(lastCol+'1').c+1;x++) put(sh,colLetter(x)+(r+1),txt('',style));
  if(h) sh.heights[r+1]=h;
}
function HEAD(sh,ref,labels){ ROW(sh,ref,labels.map(l=>txt(l,'head'))); }

  pd.cols=[{w:20},{w:40},{w:60}];

    banner(m,'A'+row,'MEMBER PARTIAL HADIR','C','sect'); row++;
    HEAD(m,'A'+row,['No','Nama','Iuran (Rp)']); row++;
    se.partial.forEach((p,i)=>{ ROW(m,'A'+row,[txt(i+1,'cellc'),txt(p.nama,'cell'),money(p.jumlah)]); row++; });
    row++;
    banner(m,'A'+row,'BIAYA OPERASIONAL (termasuk lapangan: jenis / no. / jam pada keterangan)','D','sect'); row++;
    HEAD(m,'A'+row,['Kategori','Keterangan','','Jumlah (Rp)']); row++;

      ROW(m,'A'+row,[txt(b.kategori,'cell'),txt(ket,'cellw'),txt('','cell'),money(b.jumlah)]); row++; });

  });
  return out;
}
window.__buildExport=buildExport;

function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  return new Promise((res,rej)=>{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    sc.onload=()=>res(); sc.onerror=()=>rej(new Error('load'));
    document.head.appendChild(sc);
  });
}
function applyStyle(cell,stName){
  const st=ST[stName]||ST.cell;
  const f={name:'Arial',size:st.sz||10,bold:!!st.b,italic:!!st.i};
  if(st.fc) f.color={argb:st.fc};
  cell.font=f;
  if(st.bg) cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:st.bg}};
  if(st.al||st.wrap){ const a={vertical:'center'}; if(st.al) a.horizontal=st.al; if(st.wrap) a.wrapText=true; cell.alignment=a; }
  if(st.bd){ const b={style:'thin',color:{argb:'FFBFBFBF'}}; cell.border={top:b,left:b,bottom:b,right:b}; }
}
let EXPORTING=false;
async function doExport(){
  if(EXPORTING) return; EXPORTING=true;
  const btn=root.querySelector('#btn-export'), label=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='Memuat pustaka Excel…'; }
  try{
    await loadExcelJS();
    if(btn) btn.textContent='Menyusun workbook…';
    const data=buildExport();
    const wb=new ExcelJS.Workbook();
    wb.creator=STATE.settings.pbName; wb.created=new Date();
    data.forEach(({name,sh})=>{
      const ws=wb.addWorksheet(name.slice(0,31));
      (sh.cols||[]).forEach((c,i)=>{ ws.getColumn(i+1).width=c.w; });
      sh.rows.forEach((row,ri)=>{ (row||[]).forEach((c,ci)=>{
        if(!c) return;
        const cell=ws.getCell(ri+1,ci+1);
        if(c.t==='d'){ const [y,mo,d]=String(c.v).split('-').map(Number); cell.value=new Date(Date.UTC(y,mo-1,d)); }
        else cell.value=c.v;
        if(c.z) cell.numFmt=c.z;
        applyStyle(cell,c.st);
      }); });
      Object.entries(sh.heights||{}).forEach(([r2,h])=>{ ws.getRow(Number(r2)).height=h; });
      (sh.merges||[]).forEach(rg=>{ try{ ws.mergeCells(rg); }catch(e){} });
    });
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`Kas-${STATE.settings.pbName.replace(/\s+/g,'-')}_${todayStr()}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('File Excel berhasil diunduh.');
  }catch(e){ console.error(e); toast(e && e.message==='load' ? 'Gagal memuat pustaka Excel.' : 'Ekspor gagal. Coba lagi.'); }
  finally{ EXPORTING=false; if(btn){ btn.disabled=false; btn.textContent=label||'Unduh sebagai file Excel'; } }
}

function cellRaw(ws,ref){
  const v=ws.getCell(ref).value;
  if(v&&typeof v==='object'&&!(v instanceof Date)){
    if('result' in v) return v.result;
    if('richText' in v) return v.richText.map(t=>t.text).join('');
    if('text' in v) return v.text;
    return null;
  }
  return v;
}
function cellNum(ws,ref){ const v=cellRaw(ws,ref); const n=Number(v); return isFinite(n)?n:0; }
function cellStr(ws,ref){ const v=cellRaw(ws,ref); return v==null?'':String(v).trim(); }
function cellDate(ws,ref){
  const v=cellRaw(ws,ref);
  if(v instanceof Date) return `${v.getUTCFullYear()}-${pad(v.getUTCMonth()+1)}-${pad(v.getUTCDate())}`;
  const s=String(v||'').trim(); const m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return `${m[1]}-${pad(Number(m[2]))}-${pad(Number(m[3]))}`;
  return null;
}
/* ====== Impor dari Excel rekap manual klub (format "Tot. Kehadiran Pemain" + "Rekap Biaya Op") ====== */
function colLetter(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function cellRC(ws,r,c){ return cellRaw(ws,colLetter(c)+r); }
function cellStrRC(ws,r,c){ const v=cellRC(ws,r,c); return v==null?'':String(v).trim(); }
function cellDateRC(ws,r,c){ return cellDate(ws,colLetter(c)+r); }
function isNum(v){ return typeof v==='number' && isFinite(v); }
function scanHeaderRow(ws,labels,maxRow){
  maxRow=maxRow||15; const maxCol=20;
  for(let r=1;r<=maxRow;r++){
    const found={};
    for(let c=1;c<=maxCol;c++){
      const raw=cellStrRC(ws,r,c); if(!raw) continue;
      const norm=raw.toLowerCase().replace(/\s+/g,' ').trim();
      labels.forEach(lab=>{ if(norm===lab.toLowerCase()) found[lab]=c; });
    }
    if(Object.keys(found).length>=2) return {row:r,cols:found};
  }
  return null;
}
function parseTanggalSheetKlub(name){
  const m=/\((\d{1,2})-(\d{1,2})-(\d{2,4})\)\s*$/.exec(String(name).trim());
  if(!m) return null;
  let d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]); if(y<100) y+=2000;
  if(!d||!mo||!y) return null;
  return `${y}-${pad(mo)}-${pad(d)}`;
}
function klubKategoriKeluar(katRaw,ketRaw){
  const s=(String(katRaw)+' '+String(ketRaw)).toLowerCase();
  if(/shuttle|kok\b/.test(s)) return 'Shuttlecock';
  if(/lapangan/.test(s)) return 'Sewa Lapangan';
  return 'Lainnya (Pengeluaran)';
}
function detectLokasiKlub(ws){
  if(!ws) return '';
  let viaLabel='',viaAt='';
  for(let r=1;r<=8;r++){
    for(let c=1;c<=16;c++){
      const raw=cellStrRC(ws,r,c); if(!raw) continue;
      if(!viaLabel && /^lokasi$/i.test(raw)){
        const v=cellStrRC(ws,r,c+1);
        if(v&&!/^#[A-Z0-9\/]+[!?]?$/.test(v)) viaLabel=v;
      }
      if(!viaAt && raw.includes('@')){
        const part=raw.split('@')[1]; if(part&&part.trim()) viaAt=part.trim();
      }
    }
  }
  return viaLabel||viaAt||'';
}
function isWorkbookKlub(wb){
  let found=false;
  wb.eachSheet(ws=>{ if(/^Tot\.?\s*Kehadiran Pemain/i.test(ws.name)||/^Rekap Biaya Op/i.test(ws.name)) found=true; });
  return found;
}
function parseWorkbookKlub(wb){
  const hasil={pool:[],siklus:[],sesi:[],transactions:[],settings:clone(STATE.settings)};
  const st=hasil.settings;
  let n=0;

  /* 1) Siklus keanggotaan dari sheet "Total Member <label>" */
  wb.eachSheet(ws=>{
    const m=/^Total Member\s+(.+)$/i.exec(String(ws.name).trim());
    if(!m) return;
    const label=m[1].trim();
    const hdr=scanHeaderRow(ws,['No','Nama','Ket','Iuran'],12);
    if(!hdr||!hdr.cols['Nama']) return;
    const cNo=hdr.cols['No'],cNama=hdr.cols['Nama'],cKet=hdr.cols['Ket'],cIuran=hdr.cols['Iuran'];
    let mulai=null;
    for(let r=1;r<=6&&!mulai;r++){ for(let c=1;c<=12;c++){ if(cellRC(ws,r,c) instanceof Date){ mulai=cellDateRC(ws,r,c); break; } } }
    const full=[]; let r=hdr.row+1; const maxR=hdr.row+300;
    while(r<=maxR){
      const nama=cNama?cellStrRC(ws,r,cNama):''; const no=cNo?cellStrRC(ws,r,cNo):'';
      if(!nama&&!no) break;
      if(nama){ const jml=cIuran?cellRC(ws,r,cIuran):null; full.push({id:'sl-'+uid(),nama,jumlah:isNum(jml)?jml:st.iuranFull,lunas:cKet?!!cellRC(ws,r,cKet):true}); }
      r++;
    }
    if(full.length) hasil.siklus.push({id:'sik-'+uid(),label,mulai:mulai||todayStr(),full,lapanganMember:[],updatedAt:Date.now()});
  });

  /* 2) Pasangkan sheet "Tot. Kehadiran Pemain (tgl)" & "Rekap Biaya Op (tgl)" berdasarkan tanggal di nama sheet */
  const attSheets={},biSheets={};
  wb.eachSheet(ws=>{
    const nm=String(ws.name).trim();
    if(/^Tot\.?\s*Kehadiran Pemain/i.test(nm)){ const d=parseTanggalSheetKlub(nm); if(d) attSheets[d]=ws; }
    else if(/^Rekap Biaya Op/i.test(nm)){ const d=parseTanggalSheetKlub(nm); if(d) biSheets[d]=ws; }
  });
  const dates=[...new Set([...Object.keys(attSheets),...Object.keys(biSheets)])].sort();

  dates.forEach(tanggal=>{
    const wsA=attSheets[tanggal],wsB=biSheets[tanggal];
    const skCocok=(hasil.siklus||[]).filter(s=>s.mulai&&s.mulai<=tanggal).sort((a,b)=>b.mulai.localeCompare(a.mulai))[0];
    const lokasiSesi=detectLokasiKlub(wsA)||detectLokasiKlub(wsB)||st.lokasi;
    if(lokasiSesi&&!st.lokasi) st.lokasi=lokasiSesi;
    const sesiRec={id:'ses-'+uid(),tanggal,lokasi:lokasiSesi,hadirFull:[],partial:[],biaya:[],masukLain:[],siklusId:skCocok?skCocok.id:null};

    if(wsA){
      const hdr=scanHeaderRow(wsA,['No','Nama','Ket'],12);
      if(hdr&&hdr.cols['Nama']){
        const cNo=hdr.cols['No'],cNama=hdr.cols['Nama'],cKet=hdr.cols['Ket'];
        let r=hdr.row+1; const maxR=hdr.row+300;
        while(r<=maxR){
          const nama=cellStrRC(wsA,r,cNama); const no=cNo?cellStrRC(wsA,r,cNo):'';
          if(!nama&&!no) break;
          if(nama){
            let fee=0;
            if(cKet){ for(let c=cKet-1;c<=cKet+1;c++){ const v=cellRC(wsA,r,c); if(isNum(v)&&v>0){ fee=v; break; } } }
            if(fee>0) sesiRec.partial.push({nama,jumlah:fee});
            else sesiRec.hadirFull.push({nama});
          }
          r++;
        }
      }
    }

    if(wsB){
      const hdr=scanHeaderRow(wsB,['No','Kategori','Jenis','Keterangan','Total'],12);
      if(hdr&&hdr.cols['Keterangan']&&hdr.cols['Total']){
        const cKat=hdr.cols['Kategori']||hdr.cols['Jenis'],cKet=hdr.cols['Keterangan'],cTot=hdr.cols['Total'];
        const maxR=hdr.row+80;
        for(let r=hdr.row+1;r<=maxR;r++){
          const totVal=cellRC(wsB,r,cTot);
          if(!isNum(totVal)||totVal<=0) continue;
          const katRaw=cKat?cellStrRC(wsB,r,cKat):'', ketRaw=cKet?cellStrRC(wsB,r,cKet):'';
          if(!katRaw&&!ketRaw) continue;
          if(/member partial|member full/i.test(katRaw+' '+ketRaw)) continue; /* sudah tercakup dari data kehadiran & siklus, hindari dobel hitung */
          if(/pemasukan|^iuran/i.test(katRaw)){
            sesiRec.masukLain.push({keterangan:ketRaw||katRaw,jumlah:totVal});
          }else{
            const kategori=klubKategoriKeluar(katRaw,ketRaw);
            let jenisLapangan,noLapangan,jam;
            if(kategori==='Sewa Lapangan'){
              jenisLapangan=/non[\s-]*member/i.test(ketRaw)?'Non-Member':(/\bmember\b/i.test(ketRaw)?'Member':'Non-Member');
              const lm=/lapangan\s*(\d+)/i.exec(ketRaw); noLapangan=lm?('Lapangan '+lm[1]):'';
              jam=cellStrRC(wsB,r,cKet+1)||'';
              if(jenisLapangan==='Member'&&skCocok){
                if(!skCocok.lapanganMember) skCocok.lapanganMember=[];
                let slot=skCocok.lapanganMember.find(x=>x.noLapangan===noLapangan);
                if(!slot){ slot={id:'lm-'+uid(),noLapangan:noLapangan||('Lapangan '+(skCocok.lapanganMember.length+1)),jam:jam||'',biaya:totVal}; skCocok.lapanganMember.push(slot); }
                else if(!slot.jam&&jam) slot.jam=jam;
              }
            }
            sesiRec.biaya.push({kategori,keterangan:ketRaw||katRaw,jumlah:totVal,jenisLapangan,noLapangan,jam});
          }
        }
      }
    }

    hasil.sesi.push(sesiRec);
    sesiRec.hadirFull.forEach(h=>{ if(h.nama&&!hasil.pool.includes(h.nama)) hasil.pool.push(h.nama); });
    sesiRec.partial.forEach(p=>{ n++; hasil.transactions.push({id:'imp2-t-'+n,createdAt:n,tanggal,jenis:'Masuk',kategori:'Iuran Partial',keterangan:'Iuran partial - sesi '+tanggal,jumlah:p.jumlah,nama:p.nama,sesiId:sesiRec.id}); if(p.nama&&!hasil.pool.includes(p.nama)) hasil.pool.push(p.nama); });
    sesiRec.biaya.forEach(b=>{ n++; hasil.transactions.push({id:'imp2-t-'+n,createdAt:n,tanggal,jenis:'Keluar',kategori:b.kategori,keterangan:b.keterangan,jumlah:b.jumlah,sesiId:sesiRec.id,jenisLapangan:b.jenisLapangan,noLapangan:b.noLapangan,jam:b.jam}); });
    sesiRec.masukLain.forEach(b=>{ n++; hasil.transactions.push({id:'imp2-t-'+n,createdAt:n,tanggal,jenis:'Masuk',kategori:'Lainnya (Pemasukan)',keterangan:b.keterangan,jumlah:b.jumlah,sesiId:sesiRec.id}); });
  });

  hasil.siklus.forEach(sk=>sk.full.forEach(fm=>{
    if(fm.lunas&&fm.nama){ n++; const sesiPertama=hasil.sesi.filter(se=>se.siklusId===sk.id).sort((a,b)=>a.tanggal.localeCompare(b.tanggal))[0];
      hasil.transactions.push({id:'imp2-t-'+n,createdAt:n,tanggal:sk.mulai,jenis:'Masuk',kategori:'Iuran Full',keterangan:'Iuran '+sk.label,jumlah:fm.jumlah,nama:fm.nama,siklusId:sk.id,slotId:fm.id,sesiId:sesiPertama?sesiPertama.id:null}); if(!hasil.pool.includes(fm.nama)) hasil.pool.push(fm.nama); }
  }));
  return hasil;
}
window.__parseWorkbookKlub=parseWorkbookKlub;

function parseWorkbook(wb){
  const hasil={pool:[],siklus:[],sesi:[],transactions:[],settings:clone(STATE.settings)};
  const st=hasil.settings;
  const pg=wb.getWorksheet('Pengaturan');
  if(pg){
    const map={}; for(let r=4;r<=12;r++){ const k=cellStr(pg,'A'+r); if(k) map[k]=cellRaw(pg,'B'+r); }
    if(map['Nama PB']) st.pbName=String(map['Nama PB']);
    if(map['Kepanjangan']!=null) st.pbKepanjangan=String(map['Kepanjangan']);
    if(map['Slogan']!=null) st.pbSlogan=String(map['Slogan']);
    if(map['Lokasi']!=null) st.lokasi=String(map['Lokasi']);
    if(map['Jumlah Lapangan']!=null) st.jumlahLapangan=Number(map['Jumlah Lapangan'])||st.jumlahLapangan;
    if(map['Iuran Full (per siklus)']!=null) st.iuranFull=Number(map['Iuran Full (per siklus)'])||st.iuranFull;
    if(map['Tarif Partial (per sesi)']!=null) st.tarifPartial=Number(map['Tarif Partial (per sesi)'])||st.tarifPartial;
  }
  const sl=wb.getWorksheet('Siklus Keanggotaan');
  if(sl){
    const byLabel={};
    for(let r=4;r<=400;r++){
      const label=cellStr(sl,'A'+r); if(!label) continue;
      if(!byLabel[label]) byLabel[label]={id:'sik-'+uid(),label,mulai:cellDate(sl,'B'+r)||todayStr(),full:[],lapanganMember:[],updatedAt:Date.now()};
      const nama=cellStr(sl,'C'+r);
      const noLap=cellStr(sl,'F'+r);
      if(nama){
        byLabel[label].full.push({id:'sl-'+uid(),nama,jumlah:cellNum(sl,'D'+r)||st.iuranFull,lunas:/ya/i.test(cellStr(sl,'E'+r))});
      }else if(noLap){
        byLabel[label].lapanganMember.push({id:'lm-'+uid(),noLapangan:noLap,jam:cellStr(sl,'G'+r),biaya:cellNum(sl,'H'+r)});
      }
    }
    hasil.siklus=Object.values(byLabel);
  }
  let n=0;
  wb.eachSheet(ws=>{
    const m=/^Sesi (\d{4}-\d{2}-\d{2})/.exec(ws.name);
    if(!m) return;
    const tanggal=m[1];
    const lokasi=cellStr(ws,'A2')||st.lokasi;
    const skCocok=(hasil.siklus||[]).filter(s=>s.mulai&&s.mulai<=tanggal).sort((a,b)=>b.mulai.localeCompare(a.mulai))[0];
    const sesiRec={id:'ses-'+uid(),tanggal,lokasi,hadirFull:[],partial:[],biaya:[],masukLain:[],siklusId:skCocok?skCocok.id:null};
    let r=6;
    while(cellStr(ws,'B'+r) && !/Nama/i.test(cellStr(ws,'B'+r))){ const nama=cellStr(ws,'B'+r); if(nama) sesiRec.hadirFull.push({nama}); r++; if(r>200) break; }
    r+=3;
    while(cellStr(ws,'B'+r) && !/Kategori/i.test(cellStr(ws,'A'+r))){ const nama=cellStr(ws,'B'+r); if(nama) sesiRec.partial.push({nama,jumlah:cellNum(ws,'C'+r)||st.tarifPartial}); r++; if(r>400) break; }
    r+=2;
    while(cellStr(ws,'A'+r) && cellStr(ws,'A'+r)!=='PEMASUKAN LAIN'){
      const kat=cellStr(ws,'A'+r), jml=cellNum(ws,'D'+r);
      if(jml>0){
        let keterangan=cellStr(ws,'B'+r), jenisLapangan,noLapangan,jam;
        const mm=/\[(.+?)\]$/.exec(keterangan);
        if(mm){ keterangan=keterangan.replace(/\s*\[.+?\]$/,''); const parts=mm[1].split('·').map(x=>x.trim()); jenisLapangan=parts[0]; noLapangan=parts[1]; jam=parts[2]; }
        sesiRec.biaya.push({kategori:kat||'Lainnya (Pengeluaran)',keterangan,jumlah:jml,jenisLapangan,noLapangan,jam});
      }
      r++; if(r>2000) break;
    }
    r+=2;
    while(cellStr(ws,'A'+r)){ const jml=cellNum(ws,'D'+r); if(jml>0) sesiRec.masukLain.push({keterangan:cellStr(ws,'A'+r),jumlah:jml}); r++; if(r>3000) break; }
    hasil.sesi.push(sesiRec);
    sesiRec.hadirFull.forEach(h=>{ if(h.nama && !hasil.pool.includes(h.nama)) hasil.pool.push(h.nama); });
    sesiRec.partial.forEach(p=>{ n++; hasil.transactions.push({id:'imp-t-'+n,createdAt:n,tanggal,jenis:'Masuk',kategori:'Iuran Partial',keterangan:'Iuran partial - sesi '+tanggal,jumlah:p.jumlah,nama:p.nama,sesiId:sesiRec.id}); if(p.nama&&!hasil.pool.includes(p.nama)) hasil.pool.push(p.nama); });
    sesiRec.biaya.forEach(b=>{ n++; hasil.transactions.push({id:'imp-t-'+n,createdAt:n,tanggal,jenis:'Keluar',kategori:b.kategori,keterangan:b.keterangan,jumlah:b.jumlah,sesiId:sesiRec.id}); });
    sesiRec.masukLain.forEach(b=>{ n++; hasil.transactions.push({id:'imp-t-'+n,createdAt:n,tanggal,jenis:'Masuk',kategori:'Lainnya (Pemasukan)',keterangan:b.keterangan,jumlah:b.jumlah,sesiId:sesiRec.id}); });
  });
  hasil.siklus.forEach(sk=>sk.full.forEach(fm=>{
    if(fm.lunas && fm.nama){ n++; const sesiPertama=hasil.sesi.filter(se=>se.siklusId===sk.id).sort((a,b)=>a.tanggal.localeCompare(b.tanggal))[0];
      hasil.transactions.push({id:'imp-t-'+n,createdAt:n,tanggal:sk.mulai,jenis:'Masuk',kategori:'Iuran Full',keterangan:'Iuran '+sk.label,jumlah:fm.jumlah,nama:fm.nama,siklusId:sk.id,slotId:fm.id,sesiId:sesiPertama?sesiPertama.id:null}); if(!hasil.pool.includes(fm.nama)) hasil.pool.push(fm.nama); }
  }));
  return hasil;
}
