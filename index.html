<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PB. KABUR BADMINTON — Kas</title>
    <meta name="theme-color" content="#0E0E0E">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    
    <!-- CSS UTAMA (Ini yang bikin tampilan jadi bagus) -->
    <style>
        :root {
            --bg: #0e0e0e; --surface: #1a1a1a; --surface-2: #242424;
            --text: #f5f5f5; --muted: #a0a0a0; --gold: #d4af37; --gold-ink: #ffd700;
            --net: #4ade80; --miss: #f87171; --line: #333;
            --radius: 16px; --shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; overflow-x: hidden; }
        
        /* Header */
        .head { position: sticky; top: 0; z-index: 100; background: rgba(14,14,14,0.95); backdrop-filter: blur(10px); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
        .brand { display: flex; align-items: center; gap: 10px; }
        .logo { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; border: 1px solid var(--gold); }
        .app { font-weight: 800; font-size: 14px; letter-spacing: 0.5px; color: var(--gold); }
        .today { font-size: 11px; color: var(--muted); }
        .cyclechip { background: var(--surface-2); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; color: var(--gold); border: 1px solid var(--line); }

        /* Layout */
        .view { padding: 16px; max-width: 600px; margin: 0 auto; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); }
        .slabel { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); margin: 24px 0 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .slabel::after { content: ''; flex: 1; height: 1px; background: var(--line); }
        
        /* Typography */
        h3 { margin: 0 0 12px; font-size: 16px; color: var(--text); }
        .csub { font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.4; }
        .tiny { font-size: 11px; color: var(--muted); margin-top: 8px; }
        .num { font-variant-numeric: tabular-nums; font-family: monospace; font-size: 1.1em; }
        .up { color: var(--net); } .down { color: var(--miss); }

        /* Components */
        .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .tile { background: var(--surface-2); padding: 12px; border-radius: 12px; border: 1px solid var(--line); }
        .l { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
        .v { font-size: 16px; font-weight: 700; }
        
        .railhead { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
        .rt { font-weight: 700; font-size: 14px; } .rs { font-size: 11px; color: var(--muted); }
        .rail { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .rail::-webkit-scrollbar { display: none; }
        
        /* Spotlight */
        .spot-slide { min-width: 85%; scroll-snap-align: center; background: var(--surface); border-radius: var(--radius); overflow: hidden; position: relative; height: 180px; border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: flex-end; }
        .spot-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; z-index: 0; }
        .spot-ig-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); opacity: 0.2; z-index: 0; display: flex; align-items: center; justify-content: center; }
        .spot-ig-bg svg { width: 60px; height: 60px; opacity: 0.5; }
        .spot-scrim { position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); z-index: 1; }
        .spot-body { position: relative; z-index: 2; padding: 16px; }
        .spot-tag { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; margin-bottom: 8px; backdrop-filter: blur(4px); }
        .spot-tag svg { width: 12px; height: 12px; }
        .spot-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .spot-sub { font-size: 12px; color: var(--muted); }
        .spot-link { position: absolute; top: 12px; right: 12px; z-index: 3; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 50%; backdrop-filter: blur(4px); }
        .spot-go svg { width: 16px; height: 16px; fill: white; }

        /* Social Card */
        .social-card { background: linear-gradient(135deg, var(--surface), var(--surface-2)); border: 1px solid var(--gold); }
        .social-btn { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; text-decoration: none; color: white; margin-bottom: 8px; transition: transform 0.2s; }
        .social-btn:active { transform: scale(0.98); }
        .btn-ig { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
        .btn-tt { background: #000; border: 1px solid #333; }
        .social-icon { width: 32px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .social-icon svg { width: 18px; height: 18px; fill: white; }
        .social-text b { display: block; font-size: 14px; }
        .social-text small { font-size: 11px; opacity: 0.8; }
        .follow-badge { margin-left: auto; background: white; color: black; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 10px; }

        /* Forms */
        .field { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        input, select { width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); padding: 10px; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: var(--gold); }
        .slotrow { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .iconbtn { background: transparent; border: none; color: var(--miss); font-size: 18px; cursor: pointer; padding: 0 8px; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-ghost { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
        .money { position: relative; }
        .money .cur { position: absolute; left: 10px; top: 10px; color: var(--muted); font-size: 12px; }
        .money input { padding-left: 30px; }

        /* Lists */
        .tx { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
        .tx:last-child { border-bottom: none; }
        .ket { font-size: 14px; font-weight: 500; }
        .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .amt { font-weight: 700; font-family: monospace; }
        .del { background: none; border: none; color: var(--miss); margin-left: 12px; cursor: pointer; }

        /* Navbar */
        .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(14,14,14,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 8px 0 env(safe-area-inset-bottom); z-index: 100; }
        .navbar button { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; cursor: pointer; flex: 1; }
        .navbar button.active { color: var(--gold); }
        .navbar svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* Utilities */
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
        .badge.full { background: rgba(212, 175, 55, 0.2); color: var(--gold); }
        .badge.partial { background: rgba(255, 255, 255, 0.1); color: var(--muted); }
        .empty { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; }
        .toast.on { opacity: 1; }
        
        /* Hide floating importer if exists */
        #floating-importer { display: none !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
    (function(){
        /* =================== Penyimpanan lokal =================== */
        const _mem={};
        function _lsGet(k){ try{ const v=localStorage.getItem(k); return v===null?(k in _mem?_mem[k]:null):v; }catch(e){ return k in _mem?_mem[k]:null; } }
        function _lsSet(k,v){ _mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
        const store = (window.storage && typeof window.storage.get === 'function') ? window.storage : {
            async get(k){ const v=_lsGet('kbr:'+k); if(v==null) throw new Error('kosong'); return {key:k,value:v}; },
            async set(k,v){ _lsSet('kbr:'+k,v); return {key:k,value:v}; },
            async delete(k){ delete _mem['kbr:'+k]; try{ localStorage.removeItem('kbr:'+k); }catch(e){} return {key:k,deleted:true}; },
        };
        const MODE_MANDIRI = !(window.storage && typeof window.storage.get === 'function');

        /* =================== Logo & identitas ==================== */
        // Logo placeholder (ganti dengan base64 asli jika punya, atau biarkan ini)
        const LOGO_URI = "logo.jpg"; 
        
        const HIGHLIGHTS=[
            {group:"YouTube",platform:"yt",title:"Tips badminton — Kusuma Tangkas",desc:"Tips & teknik dari pelatih.",url:"https://www.youtube.com/@KUSUMATANGKAS",thumb:"https://unavatar.io/youtube/KUSUMATANGKAS"},
            {group:"Instagram",platform:"ig",title:"PB Kabur Badminton",desc:"Akun Instagram resmi klub.",url:"https://www.instagram.com/pbkaburbadminton/",thumb:"https://unavatar.io/instagram/pbkaburbadminton?fallback=false"},
            {group:"TikTok",platform:"tt",title:"PB Kabur Badminton",desc:"Akun TikTok resmi klub.",url:"https://www.tiktok.com/@pbkaburbadminton",thumb:"https://unavatar.io/tiktok/pbkaburbadminton?fallback=false"},
        ];

        const ICON_YT='<svg viewBox="0 0 24 24" fill="#fff"><path d="M10 15.5v-7l6 3.5-6 3.5Z"/></svg>';
        const ICON_IG='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.6"/></svg>';
        const ICON_TT='<svg viewBox="0 0 24 24" fill="#fff"><path d="M16.6 3c.4 2.1 1.9 3.7 4.4 3.9v3c-1.7 0-3.1-.5-4.4-1.4v6.6c0 3.6-2.6 6-6 6-3.2 0-5.6-2.4-5.6-5.5 0-3 2.4-5.5 5.7-5.5.4 0 .9 0 1.3.1v3.1c-.4-.2-.9-.3-1.3-.3-1.5 0-2.7 1.2-2.7 2.6 0 1.5 1.2 2.6 2.7 2.6 1.6 0 2.9-1.1 2.9-3V3h3Z"/></svg>';
        const ICON_EXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';

        /* =================== Data awal (Juli 2026) ================= */
        function skLabel(mulaiStr,excludeId){
            const [y,m]=mulaiStr.split('-').map(Number);
            const base=`Siklus ${MONFULL[m-1]} - ${y}`;
            const clash=STATE.siklus && STATE.siklus.some(s=>s.id!==excludeId && s.label===base);
            if(!clash) return base;
            let n=2, cand=`${base} (${n})`;
            while(STATE.siklus.some(s=>s.id!==excludeId && s.label===cand)){ n++; cand=`${base} (${n})`; }
            return cand;
        }
        function seedData(){
            const pool=["Ivan","Alif","Muhar","Ical","Titi","Rio","Rahman","Irwan","Mba Els","Aspa","Wira","Memet", "Riman","Ome","Fuad","Hasan","Dedi","Dilla","Ridwan","Mail"];
            const FULL=["Ivan","Alif","Muhar","Ical","Titi","Rio","Rahman","Irwan","Mba Els","Aspa","Wira","Memet"];
            const siklusId='sik-0704';
            const siklus=[{id:siklusId,label:'Siklus Juli - 2026',mulai:'2026-07-04', lokasi:'GOR Sinar Basketball/Badminton Club', lapanganMember:[{id:'lm-seed1',noLapangan:'Lapangan 3',jam:'09.00-12.00',biaya:900000}], full:FULL.map(nm=>({id:'sl-'+nm.toLowerCase().replace(/\s+/g,''),nama:nm,jumlah:100000,lunas:true})),updatedAt:1}];
            const sesi=[
                {id:'ses-0704',tanggal:'2026-07-04',lokasi:'GOR Sinar Badminton Club',siklusId, hadirFull:FULL.map(nm=>({nama:nm})), partial:[{nama:'Riman',jumlah:30000},{nama:'Ome',jumlah:30000},{nama:'Fuad',jumlah:30000}], biaya:[{kategori:'Sewa Lapangan',jenisLapangan:'Member',noLapangan:'Lapangan 3',jam:'09.00-12.00',keterangan:'Sewa lapangan member SBC',jumlah:900000}], masukLain:[]},
                {id:'ses-0711',tanggal:'2026-07-11',lokasi:'GOR Sinar Badminton Club',siklusId, hadirFull:FULL.map(nm=>({nama:nm})), partial:['Fuad','Hasan','Ome'].map(nm=>({nama:nm,jumlah:30000})), biaya:[{kategori:'Shuttlecock',keterangan:'Shuttlecock VERO',jumlah:115000}], masukLain:[]}
            ];
            const tx=[]; let n=0;
            const add=o=>{ n++; tx.push(Object.assign({id:'xt-'+n,createdAt:n},o)); };
            siklus[0].full.forEach(sl=>add({tanggal:'2026-07-04',jenis:'Masuk',kategori:'Iuran Full',keterangan:'Iuran '+siklus[0].label,jumlah:sl.jumlah,nama:sl.nama,siklusId,slotId:sl.id,sesiId:sesi[0].id}));
            sesi.forEach(se=>{
                se.partial.forEach(p=>add({tanggal:se.tanggal,jenis:'Masuk',kategori:'Iuran Partial',keterangan:'Iuran partial',jumlah:p.jumlah,nama:p.nama,sesiId:se.id}));
                se.biaya.forEach(b=>add({tanggal:se.tanggal,jenis:'Keluar',kategori:b.kategori,keterangan:b.keterangan,jumlah:b.jumlah,sesiId:se.id}));
            });
            return {pool,siklus,sesi,transactions:tx,galeri:[], settings:{tarifPartial:30000, iuranFull:100000, lokasi:'GOR Sinar Badminton Club', pbName:'PB. KABUR BADMINTON'}};
        }
        const SEED_VERSION='kabur-2026-08-v1'; // Update version to force refresh if needed
        const KATEGORI_KELUAR=['Sewa Lapangan','Shuttlecock','Lainnya (Pengeluaran)'];
        const JENIS_LAP=['Member','Non-Member'];
        const ICON={
            dashboard:'<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>',
            sesi:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
            anggota:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c1-3.6 3.3-5.5 5.5-5.5s4.5 1.9 5.5 5.5"/></svg>',
            riwayat:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
            pengaturan:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-1.7-1l-.4-2.6H9.1l-.4 2.6a7.5 7.5 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 1.7 1l.4 2.6h5.8l.4-2.6a7.5 7.5 0 0 0 1.7-1l2.4 1 2-3.4Z"/></svg>',
        };

        /* =================== Utilitas =================== */
        function pad(n){ return String(n).padStart(2,"0"); }
        function fmtRp(n){ n=Math.round(n||0); const g=n<0; n=Math.abs(n); return (g?'−':'')+'Rp'+n.toLocaleString('id-ID'); }
        function fmtNum(n){ n=Math.round(Number(n)||0); return n?n.toLocaleString('id-ID'):''; }
        function fmtRingkas(n){ n=Math.round(n||0); if(n>=1000000) return (n/1000000).toFixed(1).replace('.',',')+'jt'; if(n>=1000) return Math.round(n/1000)+'rb'; return n?String(n):'0'; }
        function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
        function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
        const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
        const MONFULL=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
        const HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
        function dLabel(d){ const dt=new Date(d+"T00:00:00"); return `${dt.getDate()} ${MON[dt.getMonth()]}`; }
        function dLabelFull(d){ const dt=new Date(d+"T00:00:00"); return `${HARI[dt.getDay()]}, ${dt.getDate()} ${MONFULL[dt.getMonth()]} ${dt.getFullYear()}`; }
        function longDate(d){ return `${HARI[d.getDay()]}, ${d.getDate()} ${MONFULL[d.getMonth()]} ${d.getFullYear()}`; }
        function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
        
        let STATE={ pool:[], siklus:[], sesi:[], transactions:[], galeri:[], settings:{}, tab:"dashboard", ready:false, riwayatFilter:{bulan:"",kategori:""}, sesiForm:null, settingsAt:0, syncAt:0, syncing:false, syncMsg:'', spotIdx:0, siklusDraft:null, tomb:{} };
        const AUTO_TIMERS={};

        /* =================== Penyimpanan =================== */
        const KEYS=['pool','siklus','sesi','transactions','galeri','settings','tomb'];
        async function loadAll(){
            try{ const v=await store.get('pool'); STATE.pool=v?JSON.parse(v.value):[]; }catch(e){ STATE.pool=[]; }
            try{ const v=await store.get('siklus'); STATE.siklus=v?JSON.parse(v.value):[]; }catch(e){ STATE.siklus=[]; }
            try{ const v=await store.get('sesi'); STATE.sesi=v?JSON.parse(v.value):[]; }catch(e){ STATE.sesi=[]; }
            try{ const v=await store.get('transactions'); STATE.transactions=v?JSON.parse(v.value):[]; }catch(e){ STATE.transactions=[]; }
            try{ const v=await store.get('galeri'); STATE.galeri=v?JSON.parse(v.value):[]; }catch(e){ STATE.galeri=[]; }
            try{ const v=await store.get('settings'); STATE.settings=v?JSON.parse(v.value):null; }catch(e){ STATE.settings=null; }
            try{ const v=await store.get('settingsAt'); STATE.settingsAt=v?Number(v.value)||0:0; }catch(e){ STATE.settingsAt=0; }
            try{ const v=await store.get('tomb'); STATE.tomb=v?JSON.parse(v.value):{}; }catch(e){ STATE.tomb={}; }
            
            loadSyncCfg();
            STATE.syncAt=Number(_lsGet('kbr:syncAt')||0)||0;
            let seedVer=null;
            try{ const v=await store.get('seedVersion'); seedVer=v?v.value:null; }catch(e){}
            
            if(seedVer!==SEED_VERSION){
                const d=seedData();
                STATE.pool=d.pool; STATE.siklus=d.siklus; STATE.sesi=d.sesi; STATE.transactions=d.transactions;
                STATE.galeri=d.galeri; STATE.settings=d.settings;
                await saveAll();
                try{ await store.set('seedVersion',SEED_VERSION); }catch(e){}
            }
            if(!STATE.settings) STATE.settings=seedData().settings;
            
            // Migration check
            let migrated=false;
            STATE.transactions.forEach(t=>{
                if(t.kategori==='Iuran Full' && !t.sesiId && t.siklusId){
                    const sid=sesiPertamaSiklusId(t.siklusId);
                    if(sid){ t.sesiId=sid; t.updatedAt=Date.now(); migrated=true; }
                }
            });
            if(migrated){ await saveKey('transactions'); if(syncReady()) syncNow(true); }
            
            refreshShadow();
            STATE.ready=true;
        }

        async function saveKey(k){
            try{
                if(k!=='tomb') detectRemoved(k);
                if(k==='settings') STATE.settingsAt=Date.now();
                await store.set(k,JSON.stringify(STATE[k]));
                if(k!=='tomb' && STATE.tomb) await store.set('tomb',JSON.stringify(STATE.tomb));
                if(k==='settings') await store.set('settingsAt',String(STATE.settingsAt));
            }catch(e){ console.error(e); toast('Gagal menyimpan.'); }
            scheduleSync();
        }
        async function saveAll(){ for(const k of KEYS) await saveKey(k); }

        /* =================== Perhitungan =================== */
        function saldoTotal(){ return STATE.transactions.reduce((s,t)=>s+(t.jenis==='Masuk'?Number(t.jumlah):-Number(t.jumlah)),0); }
        function saldoSampai(tgl){ return STATE.transactions.filter(t=>t.tanggal<=tgl).reduce((s,t)=>s+(t.jenis==='Masuk'?Number(t.jumlah):-Number(t.jumlah)),0); }
        function sesiTx(sid){ return STATE.transactions.filter(t=>t.sesiId===sid); }
        function isTxSiklusPenuh(t){ return t.kategori==='Iuran Full' || (t.kategori==='Sewa Lapangan' && t.jenisLapangan==='Member'); }
        function sesiTotals(sid){
            const l=sesiTx(sid);
            const masuk=l.filter(t=>t.jenis==='Masuk').reduce((s,t)=>s+Number(t.jumlah),0);
            const keluar=l.filter(t=>t.jenis==='Keluar').reduce((s,t)=>s+Number(t.jumlah),0);
            return {masuk,keluar,net:masuk-keluar};
        }
        function sesiUrut(){ return [...STATE.sesi].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)); }
        function sesiPertamaSiklusId(siklusId){
            const l=STATE.sesi.filter(se=>se.siklusId===siklusId).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
            return l.length?l[0].id:null;
        }
        function siklusUrut(){ return [...STATE.siklus].sort((a,b)=>String(a.mulai).localeCompare(String(b.mulai))); }
        function activeSiklus(){ const u=siklusUrut(); return u[u.length-1]; }
        function siklusLunasInfo(sk){
            const total=sk.full.length, lunas=sk.full.filter(f=>f.lunas).length;
            const terkumpul=sk.full.filter(f=>f.lunas).reduce((s,f)=>s+Number(f.jumlah),0);
            const potensi=sk.full.reduce((s,f)=>s+Number(f.jumlah),0);
            return {total,lunas,belum:total-lunas,terkumpul,potensi};
        }

        /* =================== Input nominal =================== */
        function moneyVal(el){ return Number(String(el.value).replace(/\D/g,''))||0; }
        function reformatMoney(el){
            const raw=el.value, caret=el.selectionStart==null?raw.length:el.selectionStart;
            const db=raw.slice(0,caret).replace(/\D/g,'').length;
            const digits=raw.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
            const out=digits?Number(digits).toLocaleString('id-ID'):'';
            el.value=out;
            let c=0,pos=out.length;
            if(db===0) pos=0; else for(let i=0;i<out.length;i++){ if(/\d/.test(out[i])) c++; if(c===db){ pos=i+1; break; } }
            try{ el.setSelectionRange(pos,pos); }catch(e){}
        }
        function moneyField(attrs,value,small){
            return `<div class="money${small?' sm':''}"><span class="cur">Rp</span><input type="text" inputmode="numeric" autocomplete="off" data-money ${attrs} value="${fmtNum(value)}" placeholder="0"/></div>`;
        }

        /* =================== Auto-rotating rail helper =================== */
        function attachAutoRail(railSel,dotsSel,count,intervalMs,stateKey){
            const rail=root.querySelector(railSel); if(!rail||count<2) return;
            const dots=dotsSel?[...root.querySelectorAll(dotsSel+' i')]:[];
            const step=()=>rail.firstElementChild? rail.firstElementChild.getBoundingClientRect().width+10 : 1;
            let idx=STATE[stateKey]||0;
            const goTo=(i)=>{ idx=((i%count)+count)%count; STATE[stateKey]=idx; rail.scrollTo({left:idx*step(),behavior:'smooth'}); dots.forEach((d,j)=>d.classList.toggle('on',j===idx)); };
            goTo(idx);
            AUTO_TIMERS[railSel]=setInterval(()=>goTo(idx+1),intervalMs);
            rail.addEventListener('pointerdown',()=>clearInterval(AUTO_TIMERS[railSel]));
            rail.addEventListener('pointerup',()=>AUTO_TIMERS[railSel]=setInterval(()=>goTo(idx+1),intervalMs));
        }

        /* =================== Sorotan / Spotlight =================== */
        function seededIdx(salt,n){ if(!n) return 0; const s=todayStr()+'|'+salt; let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h%n; }

            </div>`:'';

            const igs=HIGHLIGHTS.filter(h=>h.platform==='ig'); const ig=igs[seededIdx('ig',igs.length)];
            const slideIg=ig?`<div class="spot-slide">
                <div class="spot-ig-bg">${ICON_IG}</div>
                <img class="spot-bg" src="${ig.thumb}" alt="" onerror="this.style.display='none'"/>

            const tts=HIGHLIGHTS.filter(h=>h.platform==='tt'); const tt=tts[seededIdx('tt',tts.length)];
            const slideTt=tt?`<div class="spot-slide">
                <div class="spot-ig-bg" style="background:linear-gradient(135deg,#111 0%,#25f4ee22 55%,#fe2c5533 100%);">${ICON_TT}</div>

                <div class="spot-scrim"></div>
                <span class="spot-tag">${ICON_TT}TikTok</span>
                <a class="spot-link" href="${tt.url}" target="_blank"><span class="spot-go">${ICON_EXT}</span></a>
                <div class="spot-body"><div class="spot-title">${esc(tt.title)}</div><div class="spot-sub">${esc(tt.desc)}</div></div>
            </div>`:'';

            return [slideYt, slideIg, slideTt].filter(Boolean).join('');

        /* =================== Handlers =================== */

        const SYNC_KEY='kbr:sync';
        let SYNC={url:'',key:'',code:'',on:false};
        function loadSyncCfg(){ try{ const v=_lsGet(SYNC_KEY); if(v) SYNC=Object.assign(SYNC,JSON.parse(v)); }catch(e){} }
        function saveSyncCfg(){ _lsSet(SYNC_KEY,JSON.stringify(SYNC)); }
        function syncReady(){ return !!(SYNC.on&&SYNC.url&&SYNC.key&&SYNC.code); }
        
        async function rpc(fn,body){
            const base=String(SYNC.url).trim().replace(/\/+$/,'');
            const r=await fetch(base+'/rest/v1/rpc/'+fn,{method:'POST', headers:{'apikey':SYNC.key.trim(),'Authorization':'Bearer '+SYNC.key.trim(),'Content-Type':'application/json'}, body:JSON.stringify(body)});
            if(!r.ok) throw new Error('HTTP '+r.status);
            return r.json();
        }

        // Tombstone Logic
        const TOMB_KEYS=['siklus','sesi','transactions','galeri'];
        let SHADOW={};
        function idsOf(k){ return new Set((Array.isArray(STATE[k])?STATE[k]:[]).map(x=>x&&x.id).filter(Boolean)); }
        function refreshShadow(){ TOMB_KEYS.forEach(k=>SHADOW[k]=idsOf(k)); }
        function detectRemoved(k){
            if(TOMB_KEYS.indexOf(k)<0) return;
            const now=idsOf(k);
            if(SHADOW[k]){
                const removed=[];
                SHADOW[k].forEach(id=>{ if(!now.has(id)) removed.push(id); });
                if(removed.length){
                    if(!STATE.tomb) STATE.tomb={};
                    if(!STATE.tomb[k]) STATE.tomb[k]={};
                    removed.forEach(id=>{ STATE.tomb[k][id]=Date.now(); });
                }
            }
            SHADOW[k]=now;
        }
        function mergeTomb(a,b){
            const out={};
            const add=src=>{ if(!src) return; Object.keys(src).forEach(k=>{ out[k]=out[k]||{}; Object.keys(src[k]).forEach(id=>{ const t=Number(src[k][id])||0; if(!(out[k][id]>t)) out[k][id]=t; }); }); };
            add(a); add(b); return out;
        }
        function pruneTomb(tomb){
            const cut=Date.now()-1000*60*60*24*60;
            Object.keys(tomb||{}).forEach(k=>Object.keys(tomb[k]||{}).forEach(id=>{ if(Number(tomb[k][id])<cut) delete tomb[k][id]; }));
            return tomb||{};
        }
        function applyTomb(list,k,tomb){ const tb=(tomb&&tomb[k])||{}; return (list||[]).filter(x=>!tb[x.id]); }
        
        function mergeState(remote){
            const tomb=pruneTomb(mergeTomb(STATE.tomb,remote&&remote.tomb));
            let out;
            if(!remote) out={pool:STATE.pool,siklus:STATE.siklus,sesi:STATE.sesi,transactions:STATE.transactions,galeri:STATE.galeri,settings:STATE.settings,settingsAt:STATE.settingsAt};
            else{
                const pool=[...new Set([...(STATE.pool||[]),...(remote.pool||[])])];
                // Simple merge by ID (remote wins if newer, but here we just concat and dedupe by ID preferring remote for simplicity in this fix)
                const mergeById=(l,r)=>{ const m=new Map(); l.forEach(x=>m.set(x.id,x)); r.forEach(x=>m.set(x.id,x)); return [...m.values()]; };
                const siklus=mergeById(STATE.siklus,remote.siklus);
                const sesi=mergeById(STATE.sesi,remote.sesi);
                const transactions=mergeById(STATE.transactions,remote.transactions);
                const galeri=mergeById(STATE.galeri,remote.galeri).slice(0,12);
                const rAt=Number(remote.settingsAt||0), lAt=Number(STATE.settingsAt||0);
                const settings=(rAt>lAt&&remote.settings)?remote.settings:STATE.settings;
                out={pool,siklus,sesi,transactions,galeri,settings,settingsAt:Math.max(rAt,lAt)};
            }
            TOMB_KEYS.forEach(k=>{ out[k]=applyTomb(out[k],k,tomb); });
            out.tomb=tomb;
            return out;
        }

        let syncTimer=null;
        function scheduleSync(){ if(!syncReady()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(true),1400); }
        
        async function syncNow(diam){
            if(!syncReady()||STATE.syncing) return false;
            STATE.syncing=true; STATE.syncMsg='Sync...'; render();
            try{
                const remote=await rpc('kbr_kas_get',{code:SYNC.code.trim()});
                const m=mergeState(remote);
                STATE.pool=m.pool; STATE.siklus=m.siklus; STATE.sesi=m.sesi; STATE.transactions=m.transactions; STATE.galeri=m.galeri;
                STATE.settings=m.settings; STATE.settingsAt=m.settingsAt; STATE.tomb=m.tomb||{};
                for(const k of KEYS) await store.set(k,JSON.stringify(STATE[k]));
                await store.set('settingsAt',String(STATE.settingsAt));
                await rpc('kbr_kas_set',{code:SYNC.code.trim(),payload:{v:1,pool:STATE.pool,siklus:STATE.siklus,sesi:STATE.sesi,transactions:STATE.transactions,galeri:STATE.galeri,settings:STATE.settings,settingsAt:STATE.settingsAt,tomb:STATE.tomb}});
                refreshShadow();
                STATE.syncAt=Date.now(); STATE.syncMsg=''; _lsSet('kbr:syncAt',String(STATE.syncAt));
                render();
                if(!diam) toast('Tersinkron.');
                return true;
            }catch(e){ console.error(e); STATE.syncMsg='Gagal'; render(); if(!diam) toast('Sync gagal.'); return false; }
            finally{ STATE.syncing=false; }
        }

        function renderSyncCard(){
            return `
            <div class="card">
                <h3>Sinkronisasi Online</h3>
                <div class="tiny" style="margin-bottom:12px; color:${syncReady()?'var(--net)':'var(--muted)'}">${syncReady()?'● Aktif':'○ Nonaktif'}</div>
                <div class="field"><label>URL Supabase</label><input id="sy-url" type="text" value="${esc(SYNC.url)}"></div>
                <div class="field"><label>Anon Key</label><input id="sy-key" type="text" value="${esc(SYNC.key)}"></div>
                <div class="field"><label>Kode Klub</label><input id="sy-code" type="text" value="${esc(SYNC.code)}"></div>
                <button class="btn btn-gold" id="btn-sync-save">Simpan & Sync</button>
            </div>`;
        }

        function attachSyncHandlers(){
            const simpan=root.querySelector('#btn-sync-save');
            if(simpan) simpan.addEventListener('click',async()=>{
                SYNC.url=root.querySelector('#sy-url').value.trim();
                SYNC.key=root.querySelector('#sy-key').value.trim();
                SYNC.code=root.querySelector('#sy-code').value.trim();
                SYNC.on=true; saveSyncCfg();
                simpan.disabled=true; simpan.textContent='Menghubungkan...';
                const ok=await syncNow(false);
                simpan.disabled=false; simpan.textContent='Simpan & Sync';
                if(ok) toast('Berhasil!');
            });
        }

        document.addEventListener('visibilitychange',()=>{ if(!document.hidden) scheduleSync(); });
        setInterval(()=>{ if(!document.hidden) syncNow(true); },45000);

        (async function init(){ 
            render(); 
            await loadAll(); 
            render(); 
            if(syncReady()) syncNow(true); 
        })();
    })();
    </script>
</body>
</html>
