/* =================== Auto-rotating rail helper =================== */
function attachAutoRail(railSel,dotsSel,count,intervalMs,stateKey){
const rail=root.querySelector(railSel); if(!rail||count<2) return;
const dots=dotsSel?[...root.querySelectorAll(dotsSel+' i')]:[];
const step=()=>rail.firstElementChild? rail.firstElementChild.getBoundingClientRect().width+10 : 1;
let idx=STATE[stateKey]||0;
const goTo=(i)=>{ idx=((i%count)+count)%count; STATE[stateKey]=idx; rail.scrollTo({left:idx*step(),behavior:'smooth'}); dots.forEach((d,j)=>d.classList.toggle('on',j===idx)); };
goTo(idx);
AUTO_TIMERS[railSel]=setInterval(()=>goTo(idx+1),intervalMs);
const pause=()=>{ clearInterval(AUTO_TIMERS[railSel]); };
const resume=()=>{ clearInterval(AUTO_TIMERS[railSel]); AUTO_TIMERS[railSel]=setInterval(()=>goTo(idx+1),intervalMs); };
rail.addEventListener('pointerdown',pause);
rail.addEventListener('pointerup',resume);
rail.addEventListener('scroll',()=>{ const i=Math.round(rail.scrollLeft/step()); if(i!==idx){ idx=((i%count)+count)%count; STATE[stateKey]=idx; dots.forEach((d,j)=>d.classList.toggle('on',j===idx)); } },{passive:true});
}

return STATE.transactions.filter(t=>t.siklusId===sk.id||sesiIds.has(t.sesiId));

function totalPeriodeAktif(){
const txs=transaksiPeriodeAktif();
const masuk=txs.filter(t=>t.jenis==='Masuk').reduce((s,t)=>s+Number(t.jumlah),0);
const keluar=txs.filter(t=>t.jenis==='Keluar').reduce((s,t)=>s+Number(t.jumlah),0);
return {masuk,keluar,net:masuk-keluar};
}
function keluarPeriodeAktif(){
const sk=activeSiklus();
if(!sk) return STATE.transactions.filter(t=>t.jenis==='Keluar');
const sesiIds=new Set(STATE.sesi.filter(se=>se.siklusId===sk.id).map(se=>se.id));
return STATE.transactions.filter(t=>t.jenis==='Keluar'&&(t.siklusId===sk.id||sesiIds.has(t.sesiId)));
}
function komposisiPengeluaran(){
const txs=keluarPeriodeAktif();
const map={};
txs.forEach(t=>{ const k=t.kategori||'Lainnya (Pengeluaran)'; map[k]=(map[k]||0)+Number(t.jumlah||0); });
const total=Object.values(map).reduce((a,b)=>a+b,0);
const rows=Object.entries(map).map(([k,v])=>({kategori:k,jumlah:v,pct:total?Math.round(v/total*100):0})).sort((a,b)=>b.jumlah-a.jumlah);
return {rows,total};
}
function sorotanPeriode(){
const sk=activeSiklus();
const sesiPeriode=sesiUrut().filter(se=>!sk||se.siklusId===sk.id);
const totalMasuk=sesiPeriode.reduce((s,se)=>s+sesiTotals(se.id).masuk,0);
const totalKeluar=sesiPeriode.reduce((s,se)=>s+sesiTotals(se.id).keluar,0);
const freq={};
sesiPeriode.forEach(se=>se.partial.forEach(p=>{ const nm=(p.nama||'').trim(); if(nm) freq[nm]=(freq[nm]||0)+1; }));
const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
return {label:sk?sk.label:'Semua periode',sesiCount:sesiPeriode.length,totalMasuk,totalKeluar,net:totalMasuk-totalKeluar,topPartial:top?{nama:top[0],kali:top[1]}:null};
}

function renderCalcTambahan(){
if(!STATE.calcTambahan) STATE.calcTambahan=newCalcTambahan();
const c=STATE.calcTambahan;
const total=(Number(c.hargaLapangan)||0)+(Number(c.hargaShuttlecock)||0);
const orang=Number(c.jumlahOrang)||0;
const perOrang=orang>0?total/orang:0;
return `
<div class="slabel">Jadwal tambahan (di luar Sabtu)</div>
<div class="note info">Untuk main dadakan di luar jadwal rutin Sabtu. Biaya dipatungan langsung antar yang hadir dan tidak masuk ke kas klub — form ini hanya kalkulator pembagian per orang.</div>
<div class="card">
<div class="duo-f">
<div class="field"><label>Lokasi lapangan</label><input id="ct-lokasi" type="text" placeholder="Nama GOR" value="${esc(c.lokasi)}"/></div>

}
/* =================== Riwayat =================== */
function renderRiwayat(){
const urut=[...sesiUrut()].reverse();
const f=STATE.riwayatFilter;
const months=[...new Set(STATE.transactions.map(t=>t.tanggal.slice(0,7)))].sort().reverse();
const kats=['Iuran Full','Iuran Partial',...KATEGORI_KELUAR,'Lainnya (Pemasukan)'];
let list=[...STATE.transactions].sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||(b.createdAt||0)-(a.createdAt||0));
if(f.bulan) list=list.filter(t=>t.tanggal.slice(0,7)===f.bulan);
if(f.kategori) list=list.filter(t=>t.kategori===f.kategori);
const tot={masuk:list.filter(t=>t.jenis==='Masuk').reduce((s,t)=>s+Number(t.jumlah),0),
keluar:list.filter(t=>t.jenis==='Keluar').reduce((s,t)=>s+Number(t.jumlah),0)};
return `
<div class="railhead"><span class="rt">Riwayat sesi</span><span class="rs">Geser untuk lihat semua</span></div>

const t=sesiTotals(se.id);
return `<div class="scard">

</div>`;
}).join(''):`<div class="empty" style="width:100%;">Belum ada sesi.</div>`}</div>
<div class="filters">

</div></div>`).join('')}

}
/* =================== Anggota (pool + siklus) =================== */
function renderAnggotaTotalTable(){
const skAktif=activeSiklus();
const fulls=(skAktif?skAktif.full:[]).filter(f=>(f.nama||'').trim())
.map(f=>f.nama.trim()).sort((a,b)=>a.localeCompare(b));
const fullNames=new Set(fulls);
const sesiAktif=sesiUrut().filter(se=>skAktif?se.siklusId===skAktif.id:true);
const partialSet=new Set();
sesiAktif.forEach(se=>se.partial.forEach(p=>{ const nm=(p.nama||'').trim(); if(nm && !fullNames.has(nm)) partialSet.add(nm); }));
const partials=[...partialSet].sort((a,b)=>a.localeCompare(b));
const total=fulls.length+partials.length;
return `
<div class="slabel">Total anggota keseluruhan</div>
<div class="card">
<h3>${skAktif?esc(skAktif.label):'Belum ada siklus aktif'}</h3>
<div class="csub">${total} anggota · ${fulls.length} full, ${partials.length} partial</div>
${total?`<div class="attend-cols">
<div class="attend-col">
<div class="attend-chead">Full · ${fulls.length}</div>
${fulls.length?fulls.map(nm=>`<div class="attend-r"><span class="nm">${esc(nm)}</span><span class="badge full">Full</span></div>`).join(''):`<div class="tiny">Belum ada.</div>`}
</div>
<div class="attend-col">
<div class="attend-chead">Partial · ${partials.length}</div>
${partials.length?partials.map(nm=>`<div class="attend-r"><span class="nm">${esc(nm)}</span><span class="badge partial">Partial</span></div>`).join(''):`<div class="tiny">Belum ada.</div>`}
</div>
</div>`:`<div class="empty">Belum ada anggota tercatat.</div>`}
<div class="tiny" style="margin-top:12px;">Full = roster siklus berjalan (tetap tercatat walau tidak selalu hadir, karena sudah kontribusi lapangan member). Partial = gabungan nama yang pernah hadir per sesi. Otomatis mengikuti siklus begitu siklus baru dimulai — riwayat siklus lama tetap tersimpan di bagian "Siklus keanggotaan" di bawah.</div>
</div>`;
}

/* =================== Galeri: kompresi foto =================== */
function compressImage(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>{
const img=new Image();
img.onload=()=>{
const maxW=900;
const scale=Math.min(1,maxW/img.width);
const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h);
resolve(cv.toDataURL('image/jpeg',0.65));
};
img.onerror=reject;
img.src=reader.result;
};
reader.onerror=reject;
reader.readAsDataURL(file);
});
}
async function handleFotoFiles(files){
for(const file of files){
try{
const dataUrl=await compressImage(file);
STATE.galeri.push({id:'g-'+uid(),dataUrl,caption:'',tanggal:todayStr(),createdAt:Date.now()});
}catch(e){ console.error(e); }
}
STATE.galeri.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
if(STATE.galeri.length>12) STATE.galeri=STATE.galeri.slice(0,12);
await saveKey('galeri'); render(); toast('Foto ditambahkan.');
}

function cellRaw(ws,ref){

if('richText' in v) return v.richText.map(t=>t.text).join('');
if('text' in v) return v.text;

}
return v;
}
function cellNum(ws,ref){ const v=cellRaw(ws,ref); const n=Number(v); return isFinite(n)?n:0; }
function cellStr(ws,ref){ const v=cellRaw(ws,ref); return v==null?'':String(v).trim(); }

const s=String(v||'').trim(); const m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);

}
/* ====== Impor dari Excel rekap manual klub (format "Tot. Kehadiran Pemain" + "Rekap Biaya Op") ====== */
function colLetter(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function cellRC(ws,r,c){ return cellRaw(ws,colLetter(c)+r); }
function cellStrRC(ws,r,c){ const v=cellRC(ws,r,c); return v==null?'':String(v).trim(); }
function cellDateRC(ws,r,c){ return cellDate(ws,colLetter(c)+r); }

}

}
function parseTanggalSheetKlub(name){
const m=/\((\d{1,2})-(\d{1,2})-(\d{2,4})\)\s*$/.exec(String(name).trim());
if(!m) return null;
let d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]); if(y<100) y+=2000;
if(!d||!mo||!y) return null;
return `${y}-${pad(mo)}-${pad(d)}`;
}
function klubKategoriKeluar(katRaw,ketRaw){
const s=(String(katRaw)+' '+String(ketRaw)).toLowerCase();

function detectLokasiKlub(ws){
if(!ws) return '';

for(let r=1;r<=8;r++){
for(let c=1;c<=16;c++){
const raw=cellStrRC(ws,r,c); if(!raw) continue;
if(!viaLabel && /^lokasi$/i.test(raw)){
const v=cellStrRC(ws,r,c+1);
if(v&&!/^#[A-Z0-9\/]+[!?]?$/.test(v)) viaLabel=v;
}
if(!viaAt && raw.includes('@')){
const part=raw.split('@')[1]; if(part&&part.trim()) viaAt=part.trim();

}

}
function isWorkbookKlub(wb){

wb.eachSheet(ws=>{ if(/^Tot\.?\s*Kehadiran Pemain/i.test(ws.name)||/^Rekap Biaya Op/i.test(ws.name)) found=true; });
return found;
}
function parseWorkbookKlub(wb){

const st=hasil.settings;
let n=0;
/* 1) Siklus keanggotaan dari sheet "Total Member <label>" */
wb.eachSheet(ws=>{
const m=/^Total Member\s+(.+)$/i.exec(String(ws.name).trim());
if(!m) return;
const label=m[1].trim();

if(!hdr||!hdr.cols['Nama']) return;

const skCocok=(hasil.siklus||[]).filter(s=>s.mulai&&s.mulai<=tanggal).sort((a,b)=>b.mulai.localeCompare(a.mulai))[0];
const lokasiSesi=detectLokasiKlub(wsA)||detectLokasiKlub(wsB)||st.lokasi;

const sesiRec={id:'ses-'+uid(),tanggal,lokasi:lokasiSesi,hadirFull:[],partial:[],biaya:[],masukLain:[],siklusId:skCocok?skCocok.id:null};

let r=hdr.row+1; const maxR=hdr.row+300;
while(r<=maxR){

if(nama){
let fee=0;
if(cKet){ for(let c=cKet-1;c<=cKet+1;c++){ const v=cellRC(wsA,r,c); if(isNum(v)&&v>0){ fee=v; break; } } }

}
r++;
}
}
}
if(wsB){
const hdr=scanHeaderRow(wsB,['No','Kategori','Jenis','Keterangan','Total'],12);
if(hdr&&hdr.cols['Keterangan']&&hdr.cols['Total']){
const cKat=hdr.cols['Kategori']||hdr.cols['Jenis'],cKet=hdr.cols['Keterangan'],cTot=hdr.cols['Total'];

}else{

if(kategori==='Sewa Lapangan'){

let slot=skCocok.lapanganMember.find(x=>x.noLapangan===noLapangan);
if(!slot){ slot={id:'lm-'+uid(),noLapangan:noLapangan||('Lapangan '+(skCocok.lapanganMember.length+1)),jam:jam||'',biaya:totVal}; skCocok.lapanganMember.push(slot); }
else if(!slot.jam&&jam) slot.jam=jam;

sesiRec.biaya.push({kategori,keterangan:ketRaw||katRaw,jumlah:totVal,jenisLapangan,noLapangan,jam});
}

}
}
hasil.sesi.push(sesiRec);
sesiRec.hadirFull.forEach(h=>{ if(h.nama&&!hasil.pool.includes(h.nama)) hasil.pool.push(h.nama); });
sesiRec.partial.forEach(p=>{ n++; hasil.transactions.push({id:'imp2-t-'+n,createdAt:n,tanggal,jenis:'Masuk',kategori:'Iuran Partial',keterangan:'Iuran partial - sesi '+tanggal,jumlah:p.jumlah,nama:p.nama,sesiId:sesiRec.id}); if(p.nama&&!hasil.pool.includes(p.nama)) hasil.pool.push(p.nama); });
sesiRec.biaya.forEach(b=>{ n++; hasil.transactions.push({id:'imp2-t-'+n,createdAt:n,tanggal,jenis:'Keluar',kategori:b.kategori,keterangan:b.keterangan,jumlah:b.jumlah,sesiId:sesiRec.id,jenisLapangan:b.jenisLapangan,noLapangan:b.noLapangan,jam:b.jam}); });
sesiRec.masukLain.forEach(b=>{ n++; hasil.transactions.push({id:'imp2-t-'+n,createdAt:n,tanggal,jenis:'Masuk',kategori:'Lainnya (Pemasukan)',keterangan:b.keterangan,jumlah:b.jumlah,sesiId:sesiRec.id}); });

}));

}

const SYNC_KEY='kbr:sync';
let SYNC={url:'',key:'',code:'',on:false};
function loadSyncCfg(){ try{ const v=_lsGet(SYNC_KEY); if(v) SYNC=Object.assign(SYNC,JSON.parse(v)); }catch(e){} }
function saveSyncCfg(){ _lsSet(SYNC_KEY,JSON.stringify(SYNC)); }
function syncReady(){ return !!(SYNC.on&&SYNC.url&&SYNC.key&&SYNC.code); }
function kodeAcak(){ const a='abcdefghjkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<20;i++) s+=a[Math.floor(Math.random()*a.length)]; return s.replace(/(.{5})(?=.)/g,'$1-'); }
async function rpc(fn,body){
const base=String(SYNC.url).trim().replace(/\/+$/,'');
const r=await fetch(base+'/rest/v1/rpc/'+fn,{method:'POST',
headers:{'apikey':SYNC.key.trim(),'Authorization':'Bearer '+SYNC.key.trim(),'Content-Type':'application/json','Accept':'application/json'},
body:JSON.stringify(body)});
const teks=await r.text();
if(!r.ok) throw new Error('HTTP '+r.status+(teks?' — '+teks.slice(0,140):''));
return teks?JSON.parse(teks):null;
}
function umur(t){ if(!t) return null; const d=Math.round((Date.now()-t)/1000);
if(d<60) return 'baru saja'; if(d<3600) return Math.round(d/60)+' menit lalu'; if(d<86400) return Math.round(d/3600)+' jam lalu'; return Math.round(d/86400)+' hari lalu'; }
function mergeById(local,remote,idKey){
const map=new Map();
(local||[]).forEach(x=>map.set(x[idKey],x));
(remote||[]).forEach(x=>{ const cur=map.get(x[idKey]); if(!cur||Number(x.updatedAt||x.createdAt||0)>Number(cur.updatedAt||cur.createdAt||0)) map.set(x[idKey],x); });
return [...map.values()];
}
/* ===== TOMBSTONE: biar yang dihapus tidak hidup lagi saat sinkron ===== */
const TOMB_KEYS=['siklus','sesi','transactions','galeri'];
let SHADOW={};
function idsOf(k){ return new Set((Array.isArray(STATE[k])?STATE[k]:[]).map(x=>x&&x.id).filter(Boolean)); }
function refreshShadow(){ TOMB_KEYS.forEach(k=>SHADOW[k]=idsOf(k)); }
function detectRemoved(k){
if(TOMB_KEYS.indexOf(k)<0) return;
const now=idsOf(k);
if(SHADOW[k]){
const removed=[];
SHADOW[k].forEach(id=>{ if(!now.has(id)) removed.push(id); });
if(removed.length){
if(!STATE.tomb) STATE.tomb={};
if(!STATE.tomb[k]) STATE.tomb[k]={};
removed.forEach(id=>{ STATE.tomb[k][id]=Date.now(); });
}
}
SHADOW[k]=now;
}
function mergeTomb(a,b){
const out={};
const add=src=>{ if(!src) return; Object.keys(src).forEach(k=>{ out[k]=out[k]||{}; Object.keys(src[k]).forEach(id=>{ const t=Number(src[k][id])||0; if(!(out[k][id]>t)) out[k][id]=t; }); }); };
add(a); add(b); return out;
}
function pruneTomb(tomb){
const cut=Date.now()-1000*60*60*24*60;
Object.keys(tomb||{}).forEach(k=>Object.keys(tomb[k]||{}).forEach(id=>{ if(Number(tomb[k][id])<cut) delete tomb[k][id]; }));
return tomb||{};
}
function applyTomb(list,k,tomb){ const tb=(tomb&&tomb[k])||{}; return (list||[]).filter(x=>!tb[x.id]); }
function mergeState(remote){
const tomb=pruneTomb(mergeTomb(STATE.tomb,remote&&remote.tomb));
let out;
if(!remote) out={pool:STATE.pool,siklus:STATE.siklus,sesi:STATE.sesi,transactions:STATE.transactions,galeri:STATE.galeri,settings:STATE.settings,settingsAt:STATE.settingsAt};
else{
const pool=[...new Set([...(STATE.pool||[]),...(remote.pool||[])])];
const siklus=mergeById(STATE.siklus,remote.siklus,'id');
const sesi=mergeById(STATE.sesi,remote.sesi,'id');
const transactions=mergeById(STATE.transactions,remote.transactions,'id');
const galeri=mergeById(STATE.galeri,remote.galeri,'id').slice(0,12);
const rAt=Number(remote.settingsAt||0), lAt=Number(STATE.settingsAt||0);
const settings=(rAt>lAt&&remote.settings)?remote.settings:STATE.settings;
out={pool,siklus,sesi,transactions,galeri,settings,settingsAt:Math.max(rAt,lAt)};
}
TOMB_KEYS.forEach(k=>{ out[k]=applyTomb(out[k],k,tomb); });
out.tomb=tomb;
return out;
}
let syncTimer=null;
function scheduleSync(){ if(!syncReady()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(true),1400); }
async function syncNow(diam){
if(!syncReady()||STATE.syncing) return false;
STATE.syncing=true; STATE.syncMsg='Menyinkronkan…'; paintSync();
try{
const remote=await rpc('kbr_kas_get',{code:SYNC.code.trim()});
const m=mergeState(remote);
STATE.pool=m.pool; STATE.siklus=m.siklus; STATE.sesi=m.sesi; STATE.transactions=m.transactions; STATE.galeri=m.galeri;
STATE.settings=m.settings; STATE.settingsAt=m.settingsAt; STATE.tomb=m.tomb||{};
for(const k of KEYS) await store.set(k,JSON.stringify(STATE[k]));
await store.set('settingsAt',String(STATE.settingsAt));
await rpc('kbr_kas_set',{code:SYNC.code.trim(),payload:{v:1,pool:STATE.pool,siklus:STATE.siklus,sesi:STATE.sesi,
transactions:STATE.transactions,galeri:STATE.galeri,settings:STATE.settings,settingsAt:STATE.settingsAt,tomb:STATE.tomb}});
refreshShadow();
STATE.syncAt=Date.now(); STATE.syncMsg=''; _lsSet('kbr:syncAt',String(STATE.syncAt));
render();
if(!diam) toast('Tersinkron dengan perangkat lain.');
return true;
}catch(e){ console.error(e); STATE.syncMsg='Gagal: '+(e.message||'tidak terhubung'); paintSync(); if(!diam) toast('Sinkronisasi gagal. '+(e.message||'').slice(0,80)); return false; }
finally{ STATE.syncing=false; }
}
function syncStatusText(){
if(!SYNC.on) return 'Nonaktif — data hanya tersimpan di perangkat ini.';
if(!syncReady()) return 'Belum lengkap — isi URL proyek, kunci anon, dan kode klub.';

const SQL_SETUP=`-- Jalankan sekali di Supabase -> SQL Editor -> New query -> Run
create table if not exists kbr_kas (
klub        text primary key,
data        jsonb not null,
updated_at  timestamptz not null default now()
);
alter table kbr_kas enable row level security;
create or replace function kbr_kas_get(code text)
returns jsonb language sql security definer set search_path = public as $$
select data from kbr_kas where klub = code;
$$;
create or replace function kbr_kas_set(code text, payload jsonb)
returns timestamptz language sql security definer set search_path = public as $$
insert into kbr_kas (klub, data, updated_at)
values (code, payload, now())
on conflict (klub) do update
set data = excluded.data, updated_at = now()
returning updated_at;
$$;
revoke all on function kbr_kas_get(text) from public;
revoke all on function kbr_kas_set(text, jsonb) from public;
grant execute on function kbr_kas_get(text) to anon;
grant execute on function kbr_kas_set(text, jsonb) to anon;`;
