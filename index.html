.ket{font-size:13.5px;font-weight:700;line-height:1.3}
.meta{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:500}
.amt{font-size:13.5px;font-weight:800;white-space:nowrap}
.amt.in{color:var(--net-ink)}.amt.out{color:var(--miss-ink)}
.del{color:var(--muted);font-size:15px;padding:5px 2px 5px 6px;opacity:.6}
.siklus-card{border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:12px;background:var(--sunk)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px}
.st{font-size:13px;font-weight:800}
.tag{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tag.ok{background:var(--net-bg);color:var(--net-ink)}
.tag.watch{background:var(--gold-bg);color:var(--gold-ink)}
.lm-rows{display:flex;flex-direction:column;gap:8px}
.lock-row{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px}
.lm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.lm-field label{display:block;font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.lock-row input[type=text]{width:100%;padding:11px 12px;border-radius:10px;background:var(--sunk);border:1.5px solid transparent;font-size:13.5px;font-weight:700}
.lm-bottom{display:flex;gap:8px;align-items:center}
.lm-bottom .lm-field{flex:1}
.sk-slots,.draft-rows{display:flex;flex-direction:column}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);transition:.18s}
.seg button.active{background:var(--surface);color:var(--gold-2);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sync-ok{color:var(--net-ink)!important;font-weight:700!important}
.sync-bad{color:var(--miss-ink)!important;font-weight:700!important}
.tipnext{color:var(--gold-ink);font-size:11.5px;font-weight:800}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
pre#sql-box{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:10px;line-height:1.5;overflow-x:auto;white-space:pre}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(94px + env(safe-area-inset-bottom));background:var(--gold);color:#191204;padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:800;z-index:60;opacity:0;transition:.22s;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:flex;align-items:center;justify-content:center;height:70vh;color:var(--muted);font-size:13px}
.empty{text-align:center;padding:34px 12px;color:var(--muted);font-size:13px;font-weight:500;line-height:1.6}
.wk-slide{max-height:300px;overflow-y:auto}
#floating-importer{position:fixed;z-index:999999;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#FFD700 0%,#D4AF37 100%);box-shadow:0 4px 15px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:26px;color:#111;user-select:none;touch-action:none;cursor:grab;right:16px;bottom:calc(84px + env(safe-area-inset-bottom))}

function saldoTotal(){ return STATE.transactions.reduce((s,t)=>s+(t.jenis==='Masuk'?Number(t.jumlah):-Number(t.jumlah)),0); }
function saldoSampai(tgl){ return STATE.transactions.filter(t=>t.tanggal<=tgl).reduce((s,t)=>s+(t.jenis==='Masuk'?Number(t.jumlah):-Number(t.jumlah)),0); }
function sesiTx(sid){ return STATE.transactions.filter(t=>t.sesiId===sid); }
function isTxSiklusPenuh(t){ return t.kategori==='Iuran Full' || (t.kategori==='Sewa Lapangan' && t.jenisLapangan==='Member'); }
function sesiTotalsRutin(sid){
const l=sesiTx(sid).filter(t=>!isTxSiklusPenuh(t));
const masuk=l.filter(t=>t.jenis==='Masuk').reduce((s,t)=>s+Number(t.jumlah),0);
const keluar=l.filter(t=>t.jenis==='Keluar').reduce((s,t)=>s+Number(t.jumlah),0);
return {masuk,keluar,net:masuk-keluar};
}
function sesiTotals(sid){
const l=sesiTx(sid);
const masuk=l.filter(t=>t.jenis==='Masuk').reduce((s,t)=>s+Number(t.jumlah),0);
const keluar=l.filter(t=>t.jenis==='Keluar').reduce((s,t)=>s+Number(t.jumlah),0);
return {masuk,keluar,net:masuk-keluar};
}
function sesiUrut(){ return [...STATE.sesi].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)); }
function sesiPertamaSiklusId(siklusId){
const l=STATE.sesi.filter(se=>se.siklusId===siklusId).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
return l.length?l[0].id:null;
}
function siklusUrut(){ return [...STATE.siklus].sort((a,b)=>String(a.mulai).localeCompare(String(b.mulai))); }
function activeSiklus(){ const u=siklusUrut(); return u[u.length-1]; }
function siklusLunasInfo(sk){
const total=sk.full.length, lunas=sk.full.filter(f=>f.lunas).length;
const terkumpul=sk.full.filter(f=>f.lunas).reduce((s,f)=>s+Number(f.jumlah),0);
const potensi=sk.full.reduce((s,f)=>s+Number(f.jumlah),0);
return {total,lunas,belum:total-lunas,terkumpul,potensi};
}
function statusKas(kas,avgKeluar){
if(kas<0) return 'DEFISIT';
if(avgKeluar>0 && kas<avgKeluar) return 'KETAT';
return 'AMAN';
}
function courtBookingsOf(se){ return (se&&se.biaya||[]).filter(b=>b.kategori==='Sewa Lapangan'); }
function durasiJamText(jam){
if(!jam) return '';
const m=/(\d{1,2})[.:](\d{2})\s*-\s*(\d{1,2})[.:](\d{2})/.exec(jam);
if(!m) return '';
const start=Number(m[1])+Number(m[2])/60, end=Number(m[3])+Number(m[4])/60;
let d=end-start; if(d<=0) d+=24;
const r=Math.round(d*100)/100;
return (r%1===0?r:r.toFixed(1))+' jam';
}

function moneyVal(el){ return Number(String(el.value).replace(/\D/g,''))||0; }
function reformatMoney(el){
const raw=el.value, caret=el.selectionStart==null?raw.length:el.selectionStart;
const db=raw.slice(0,caret).replace(/\D/g,'').length;
const digits=raw.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
const out=digits?Number(digits).toLocaleString('id-ID'):'';
el.value=out;
let c=0,pos=out.length;
if(db===0) pos=0; else for(let i=0;i<out.length;i++){ if(/\d/.test(out[i])) c++; if(c===db){ pos=i+1; break; } }
try{ el.setSelectionRange(pos,pos); }catch(e){}
}

/* =================== Auto-rotating rail helper =================== */
function attachAutoRail(railSel,dotsSel,count,intervalMs,stateKey){
const rail=root.querySelector(railSel); if(!rail||count<2) return;
const dots=dotsSel?[...root.querySelectorAll(dotsSel+' i')]:[];
const step=()=>rail.firstElementChild? rail.firstElementChild.getBoundingClientRect().width+10 : 1;
let idx=STATE[stateKey]||0;
const goTo=(i)=>{ idx=((i%count)+count)%count; STATE[stateKey]=idx; rail.scrollTo({left:idx*step(),behavior:'smooth'}); dots.forEach((d,j)=>d.classList.toggle('on',j===idx)); };
goTo(idx);
AUTO_TIMERS[railSel]=setInterval(()=>goTo(idx+1),intervalMs);
const pause=()=>{ clearInterval(AUTO_TIMERS[railSel]); };
const resume=()=>{ clearInterval(AUTO_TIMERS[railSel]); AUTO_TIMERS[railSel]=setInterval(()=>goTo(idx+1),intervalMs); };
rail.addEventListener('pointerdown',pause);
rail.addEventListener('pointerup',resume);
rail.addEventListener('scroll',()=>{ const i=Math.round(rail.scrollLeft/step()); if(i!==idx){ idx=((i%count)+count)%count; STATE[stateKey]=idx; dots.forEach((d,j)=>d.classList.toggle('on',j===idx)); } },{passive:true});
}

function cellRaw(ws,ref){
const v=ws.getCell(ref).value;
if(v&&typeof v==='object'&&!(v instanceof Date)){
if('result' in v) return v.result;
if('richText' in v) return v.richText.map(t=>t.text).join('');
if('text' in v) return v.text;

}
return v;
}
function cellNum(ws,ref){ const v=cellRaw(ws,ref); const n=Number(v); return isFinite(n)?n:0; }

const v=cellRaw(ws,ref);

const s=String(v||'').trim(); const m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);

function colLetter(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }

function parseWorkbookKlub(wb){

const lokasiSesi=detectLokasiKlub(wsA)||detectLokasiKlub(wsB)||st.lokasi;

const sesiRec={id:'ses-'+uid(),tanggal,lokasi:lokasiSesi,hadirFull:[],partial:[],biaya:[],masukLain:[],siklusId:skCocok?skCocok.id:null};

if(nama){
let fee=0;

hasil.sesi.push(sesiRec);
sesiRec.hadirFull.forEach(h=>{ if(h.nama && !hasil.pool.includes(h.nama)) hasil.pool.push(h.nama); });
sesiRec.partial.forEach(p=>{ n++; hasil.transactions.push({id:'imp-t-'+n,createdAt:n,tanggal,jenis:'Masuk',kategori:'Iuran Partial',keterangan:'Iuran partial - sesi '+tanggal,jumlah:p.jumlah,nama:p.nama,sesiId:sesiRec.id}); if(p.nama&&!hasil.pool.includes(p.nama)) hasil.pool.push(p.nama); });
sesiRec.biaya.forEach(b=>{ n++; hasil.transactions.push({id:'imp-t-'+n,createdAt:n,tanggal,jenis:'Keluar',kategori:b.kategori,keterangan:b.keterangan,jumlah:b.jumlah,sesiId:sesiRec.id}); });
sesiRec.masukLain.forEach(b=>{ n++; hasil.transactions.push({id:'imp-t-'+n,createdAt:n,tanggal,jenis:'Masuk',kategori:'Lainnya (Pemasukan)',keterangan:b.keterangan,jumlah:b.jumlah,sesiId:sesiRec.id}); });
});
hasil.siklus.forEach(sk=>sk.full.forEach(fm=>{
if(fm.lunas && fm.nama){ n++; const sesiPertama=hasil.sesi.filter(se=>se.siklusId===sk.id).sort((a,b)=>a.tanggal.localeCompare(b.tanggal))[0];
hasil.transactions.push({id:'imp-t-'+n,createdAt:n,tanggal:sk.mulai,jenis:'Masuk',kategori:'Iuran Full',keterangan:'Iuran '+sk.label,jumlah:fm.jumlah,nama:fm.nama,siklusId:sk.id,slotId:fm.id,sesiId:sesiPertama?sesiPertama.id:null}); if(!hasil.pool.includes(fm.nama)) hasil.pool.push(fm.nama); }
}));
return hasil;
}

const SYNC_KEY='kbr:sync';
let SYNC={url:'',key:'',code:'',on:false};
function loadSyncCfg(){ try{ const v=_lsGet(SYNC_KEY); if(v) SYNC=Object.assign(SYNC,JSON.parse(v)); }catch(e){} }

function kodeAcak(){ const a='abcdefghjkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<20;i++) s+=a[Math.floor(Math.random()*a.length)]; return s.replace(/(.{5})(?=.)/g,'$1-'); }
async function rpc(fn,body){
const base=String(SYNC.url).trim().replace(/\/+$/,'');
const r=await fetch(base+'/rest/v1/rpc/'+fn,{method:'POST',
headers:{'apikey':SYNC.key.trim(),'Authorization':'Bearer '+SYNC.key.trim(),'Content-Type':'application/json','Accept':'application/json'},
body:JSON.stringify(body)});
const teks=await r.text();
if(!r.ok) throw new Error('HTTP '+r.status+(teks?' — '+teks.slice(0,140):''));

}
function umur(t){ if(!t) return null; const d=Math.round((Date.now()-t)/1000);
if(d<60) return 'baru saja'; if(d<3600) return Math.round(d/60)+' menit lalu'; if(d<86400) return Math.round(d/3600)+' jam lalu'; return Math.round(d/86400)+' hari lalu'; }
function mergeById(local,remote,idKey){
const map=new Map();
(local||[]).forEach(x=>map.set(x[idKey],x));
(remote||[]).forEach(x=>{ const cur=map.get(x[idKey]); if(!cur||Number(x.updatedAt||x.createdAt||0)>Number(cur.updatedAt||cur.createdAt||0)) map.set(x[idKey],x); });
return [...map.values()];
}
/* ===== TOMBSTONE: biar yang dihapus tidak hidup lagi saat sinkron ===== */
const TOMB_KEYS=['siklus','sesi','transactions','galeri'];
let SHADOW={};
function idsOf(k){ return new Set((Array.isArray(STATE[k])?STATE[k]:[]).map(x=>x&&x.id).filter(Boolean)); }
function refreshShadow(){ TOMB_KEYS.forEach(k=>SHADOW[k]=idsOf(k)); }
function detectRemoved(k){
if(TOMB_KEYS.indexOf(k)<0) return;
const now=idsOf(k);
if(SHADOW[k]){
const removed=[];
SHADOW[k].forEach(id=>{ if(!now.has(id)) removed.push(id); });
if(removed.length){
if(!STATE.tomb) STATE.tomb={};
if(!STATE.tomb[k]) STATE.tomb[k]={};
removed.forEach(id=>{ STATE.tomb[k][id]=Date.now(); });
}
}
SHADOW[k]=now;
}
function mergeTomb(a,b){
const out={};
const add=src=>{ if(!src) return; Object.keys(src).forEach(k=>{ out[k]=out[k]||{}; Object.keys(src[k]).forEach(id=>{ const t=Number(src[k][id])||0; if(!(out[k][id]>t)) out[k][id]=t; }); }); };
add(a); add(b); return out;
}
function pruneTomb(tomb){
const cut=Date.now()-1000*60*60*24*60;
Object.keys(tomb||{}).forEach(k=>Object.keys(tomb[k]||{}).forEach(id=>{ if(Number(tomb[k][id])<cut) delete tomb[k][id]; }));
return tomb||{};
}
function applyTomb(list,k,tomb){ const tb=(tomb&&tomb[k])||{}; return (list||[]).filter(x=>!tb[x.id]); }
function mergeState(remote){
const tomb=pruneTomb(mergeTomb(STATE.tomb,remote&&remote.tomb));
let out;
if(!remote) out={pool:STATE.pool,siklus:STATE.siklus,sesi:STATE.sesi,transactions:STATE.transactions,galeri:STATE.galeri,settings:STATE.settings,settingsAt:STATE.settingsAt};
else{
const pool=[...new Set([...(STATE.pool||[]),...(remote.pool||[])])];
const siklus=mergeById(STATE.siklus,remote.siklus,'id');
const sesi=mergeById(STATE.sesi,remote.sesi,'id');
const transactions=mergeById(STATE.transactions,remote.transactions,'id');
const galeri=mergeById(STATE.galeri,remote.galeri,'id').slice(0,12);
const rAt=Number(remote.settingsAt||0), lAt=Number(STATE.settingsAt||0);
const settings=(rAt>lAt&&remote.settings)?remote.settings:STATE.settings;
out={pool,siklus,sesi,transactions,galeri,settings,settingsAt:Math.max(rAt,lAt)};
}
TOMB_KEYS.forEach(k=>{ out[k]=applyTomb(out[k],k,tomb); });
out.tomb=tomb;
return out;
}

async function syncNow(diam){

const m=mergeState(remote);
STATE.pool=m.pool; STATE.siklus=m.siklus; STATE.sesi=m.sesi; STATE.transactions=m.transactions; STATE.galeri=m.galeri;
STATE.settings=m.settings; STATE.settingsAt=m.settingsAt; STATE.tomb=m.tomb||{};
for(const k of KEYS) await store.set(k,JSON.stringify(STATE[k]));
await store.set('settingsAt',String(STATE.settingsAt));
await rpc('kbr_kas_set',{code:SYNC.code.trim(),payload:{v:1,pool:STATE.pool,siklus:STATE.siklus,sesi:STATE.sesi,
transactions:STATE.transactions,galeri:STATE.galeri,settings:STATE.settings,settingsAt:STATE.settingsAt,tomb:STATE.tomb}});
refreshShadow();
STATE.syncAt=Date.now(); STATE.syncMsg=''; _lsSet('kbr:syncAt',String(STATE.syncAt));

}

const SQL_SETUP=`-- Jalankan sekali di Supabase -> SQL Editor -> New query -> Run
create table if not exists kbr_kas (
klub        text primary key,
data        jsonb not null,
updated_at  timestamptz not null default now()
);
alter table kbr_kas enable row level security;
create or replace function kbr_kas_get(code text)
returns jsonb language sql security definer set search_path = public as $$
select data from kbr_kas where klub = code;
$$;
create or replace function kbr_kas_set(code text, payload jsonb)
returns timestamptz language sql security definer set search_path = public as $$
insert into kbr_kas (klub, data, updated_at)
values (code, payload, now())
on conflict (klub) do update
set data = excluded.data, updated_at = now()
returning updated_at;
$$;
revoke all on function kbr_kas_get(text) from public;
revoke all on function kbr_kas_set(text, jsonb) from public;
grant execute on function kbr_kas_get(text) to anon;
grant execute on function kbr_kas_set(text, jsonb) to anon;`;

setInterval(()=>{ if(!document.hidden) syncNow(true); },45000);
(async function init(){ render(); await loadAll(); render(); if(syncReady()) syncNow(true); })();
})();
</script>

background:linear-gradient(135deg,#FFD700 0%,#D4AF37 100%);box-shadow:0 4px 15px rgba(0,0,0,.4);
display:flex;align-items:center;justify-content:center;font-size:26px;color:#111;

</style>
<div id="floating-importer" title="Geser untuk pindah | Ketuk untuk Impor Excel">📥</div>
<script>
(function(){
const btn=document.getElementById('floating-importer');
let inp=document.getElementById('excel-input');
if(!inp){
inp=document.createElement('input'); inp.id='excel-input'; inp.type='file'; inp.accept='.xlsx'; inp.style.display='none';
inp.addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(f&&window.__doImport) window.__doImport(f); });
document.body.appendChild(inp);
}
const savedPos=localStorage.getItem('bt_pos_v2');
if(savedPos){ try{ const p=JSON.parse(savedPos); btn.style.left=p.x+'px'; btn.style.top=p.y+'px'; btn.style.right='auto'; btn.style.bottom='auto'; }catch(e){} }
let isDragging=false,startX,startY,hasMoved=false;
btn.addEventListener('pointerdown',e=>{ isDragging=true; hasMoved=false; startX=e.clientX-btn.offsetLeft; startY=e.clientY-btn.offsetTop; btn.setPointerCapture(e.pointerId); btn.style.transition='none'; });
btn.addEventListener('pointermove',e=>{ if(!isDragging) return; hasMoved=true;
let x=e.clientX-startX, y=e.clientY-startY;
x=Math.max(0,Math.min(window.innerWidth-60,x)); y=Math.max(0,Math.min(window.innerHeight-60,y));
btn.style.left=x+'px'; btn.style.top=y+'px'; btn.style.right='auto'; btn.style.bottom='auto'; });
btn.addEventListener('pointerup',e=>{ if(!isDragging) return; isDragging=false; btn.releasePointerCapture(e.pointerId);
btn.style.transition='opacity .3s ease, left .2s ease, top .2s ease';
localStorage.setItem('bt_pos_v2',JSON.stringify({x:btn.offsetLeft,y:btn.offsetTop}));
if(!hasMoved) inp.click(); });
})();
</script>
</body>
</html>
